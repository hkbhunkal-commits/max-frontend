<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#0b0b0f;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:500px;
  min-height:100vh;
  padding:30px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  margin-top:40px;
  font-size:42px;
  letter-spacing:4px;
}

#status{
  margin-top:10px;
  color:#aaa;
  text-align:center;
  min-height:24px;
}

.orb{
  width:180px;
  height:180px;
  margin:70px 0 35px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    #fff 0%,
    #777 35%,
    #111 70%
  );
  box-shadow:0 0 50px rgba(255,255,255,.25);
  transition:.3s;
}

.orb.active{
  box-shadow:0 0 80px rgba(255,255,255,.6);
  transform:scale(1.05);
}

button{
  width:220px;
  padding:15px;
  border:none;
  border-radius:30px;
  margin:8px;
  font-size:17px;
  cursor:pointer;
}

#startBtn{
  background:white;
  color:black;
}

#stopBtn{
  background:#333;
  color:white;
}

.chat{
  width:100%;
  margin-top:30px;
  display:flex;
  gap:8px;
}

#input{
  flex:1;
  padding:13px;
  border-radius:20px;
  border:1px solid #444;
  background:#17171c;
  color:white;
  outline:none;
}

#sendBtn{
  width:70px;
  margin:0;
  padding:10px;
  background:white;
  color:black;
}

#reply{
  width:100%;
  margin-top:20px;
  padding:15px;
  background:#15151a;
  border-radius:15px;
  min-height:50px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="app">

<h1>MAX</h1>

<div id="status">MAX is sleeping</div>

<div id="orb" class="orb"></div>

<button id="startBtn">START MAX</button>
<button id="stopBtn">STOP MAX</button>

<div class="chat">
<input id="input" type="text" placeholder="Type to MAX...">
<button id="sendBtn">Send</button>
</div>

<div id="reply"></div>

</div>


<script>

const BACKEND =
"https://max-backend-u4r6.onrender.com";

const statusText =
document.getElementById("status");

const orb =
document.getElementById("orb");

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const input =
document.getElementById("input");

const sendBtn =
document.getElementById("sendBtn");

const replyBox =
document.getElementById("reply");


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


let recognition = null;

let maxRunning = false;
let listening = false;
let speaking = false;
let processing = false;

let conversationMode = false;

let restartTimer = null;

let silenceTimer = null;

let lastReply = "";
let lastReplyTime = 0;


/* =========================
   STATUS
========================= */

function setStatus(text){
  statusText.textContent = text;
}


/* =========================
   CLEAN TEXT
========================= */

function cleanSpeech(text){

  if(!text) return "";

  return text
    .replace(/```[\s\S]*?```/g,"")
    .replace(/[*_#`]/g,"")
    .replace(/\s+/g," ")
    .trim();
}


/* =========================
   STOP RECOGNITION
========================= */

function stopRecognition(){

  listening=false;

  if(!recognition) return;

  try{
    recognition.stop();
  }catch(e){}

  orb.classList.remove("active");
}


/* =========================
   START RECOGNITION
========================= */

function startRecognition(){

  if(!maxRunning) return;

  if(speaking) return;

  if(processing) return;

  if(listening) return;


  if(!recognition){
    createRecognition();
  }


  try{

    listening=true;

    recognition.start();

  }catch(e){

    listening=false;

    setTimeout(()=>{
      if(
        maxRunning &&
        !speaking &&
        !processing &&
        !listening
      ){
        startRecognition();
      }
    },700);
  }
}


/* =========================
   CREATE RECOGNITION
========================= */

function createRecognition(){

  recognition =
    new SpeechRecognition();


  recognition.continuous=false;

  recognition.interimResults=false;

  recognition.lang="en-IN";


  recognition.onstart=()=>{

    listening=true;

    orb.classList.add("active");

    if(conversationMode){
      setStatus("Listening...");
    }else{
      setStatus("Say MAX...");
    }
  };


  recognition.onresult=async(event)=>{

    if(!maxRunning) return;

    if(speaking) return;

    if(processing) return;


    const text =
      event.results[
        event.results.length-1
      ][0].transcript.trim();


    listening=false;

    orb.classList.remove("active");


    if(!text){

      restartListening();

      return;
    }


    console.log("Heard:",text);


    /* =========================
       WAKE WORD
    ========================= */

    if(!conversationMode){

      const lower =
        text.toLowerCase();


      if(
        lower==="max" ||
        lower.includes("max")
      ){

        conversationMode=true;

        setStatus("Haan boss...");

        await speak("Haan boss.");


        if(maxRunning){

          setTimeout(()=>{
            startConversationListening();
          },500);

        }

      }else{

        restartListening();
      }

      return;
    }


    /* =========================
       CONVERSATION MODE
    ========================= */

    resetSilenceTimer();

    await sendMessage(text);
  };


  recognition.onerror=(event)=>{

    console.log(
      "Speech error:",
      event.error
    );

    listening=false;

    orb.classList.remove("active");


    if(!maxRunning) return;


    if(
      event.error==="not-allowed" ||
      event.error==="service-not-allowed"
    ){

      setStatus(
        "Microphone permission required."
      );

      return;
    }


    restartListening();
  };


  recognition.onend=()=>{

    listening=false;

    orb.classList.remove("active");


    if(!maxRunning) return;

    if(speaking) return;

    if(processing) return;


    restartListening();
  };
}


/* =========================
   CONVERSATION LISTENING
========================= */

function startConversationListening(){

  if(!maxRunning) return;

  if(speaking) return;

  if(processing) return;


  conversationMode=true;

  setStatus("Listening...");

  restartListening();
}


/* =========================
   RESTART
========================= */

function restartListening(){

  if(!maxRunning) return;

  if(speaking) return;

  if(processing) return;

  clearTimeout(restartTimer);


  restartTimer=setTimeout(()=>{

    if(!maxRunning) return;

    if(speaking) return;

    if(processing) return;

    if(listening) return;


    startRecognition();

  },500);
}


/* =========================
   SILENCE TIMER
========================= */

function resetSilenceTimer(){

  clearTimeout(silenceTimer);


  silenceTimer=setTimeout(()=>{

    if(
      maxRunning &&
      !speaking &&
      !processing
    ){

      conversationMode=false;

      setStatus("Say MAX...");

    }

  },12000);
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(message){

  if(!message) return;

  if(processing) return;

  if(speaking) return;


  processing=true;

  stopRecognition();

  setStatus("Thinking...");


  try{

    const response =
      await fetch(
        `${BACKEND}/chat`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message:message
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Server error"
      );
    }


    let reply =
      cleanSpeech(data.reply);


    if(!reply){

      reply=
        "Sorry boss, mujhe samajh nahi aaya.";
    }


    const now=Date.now();


    if(
      reply===lastReply &&
      now-lastReplyTime<5000
    ){

      processing=false;

      conversationMode=true;

      startConversationListening();

      return;
    }


    lastReply=reply;

    lastReplyTime=now;


    replyBox.textContent=reply;


    processing=false;


    await speak(reply);


    /*
      Keep conversation alive.
    */

    conversationMode=true;


    if(maxRunning){

      setStatus("Listening...");

      setTimeout(()=>{

        if(
          maxRunning &&
          !speaking &&
          !processing &&
          !listening
        ){

          startConversationListening();

        }

      },700);

    }


  }catch(error){

    console.error(error);

    processing=false;

    replyBox.textContent=
      "MAX connection error.";

    conversationMode=true;

    setStatus("Listening...");

    restartListening();
  }
}


/* =========================
   TEXT TO SPEECH
========================= */

function speak(text){

  return new Promise((resolve)=>{

    if(!text){

      resolve();

      return;
    }


    stopRecognition();

    speaking=true;

    setStatus("MAX speaking...");


    window.speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(text);


    /*
      Better Hindi/Hinglish detection.
    */

    const hindiChars =
      (text.match(/[\u0900-\u097F]/g)||[]).length;


    const totalChars =
      text.replace(/\s/g,"").length;


    if(
      hindiChars>0 ||
      /(\bmain\b|\bmai\b|\bhai\b|\bhaan\b|\baap\b|\baapko\b|\bkya\b|\bkaise\b|\bboss\b)/i.test(text)
    ){

      utterance.lang="hi-IN";

    }else{

      utterance.lang="en-IN";
    }


    utterance.rate=0.95;

    utterance.pitch=1;


    /*
      Try to select a better installed voice.
    */

    const voices =
      window.speechSynthesis.getVoices();


    const preferredVoice =
      voices.find(v =>
        v.lang==="hi-IN"
      ) ||
      voices.find(v =>
        v.lang==="en-IN"
      );


    if(preferredVoice){

      utterance.voice=
        preferredVoice;
    }


    let finished=false;


    function finish(){

      if(finished) return;

      finished=true;

      speaking=false;


      setTimeout(()=>{
        resolve();
      },600);
    }


    utterance.onend=finish;

    utterance.onerror=finish;


    window.speechSynthesis.speak(
      utterance
    );

  });
}


/* =========================
   START MAX
========================= */

startBtn.onclick=()=>{

  if(!SpeechRecognition){

    setStatus(
      "Voice recognition is not supported in this browser."
    );

    return;
  }


  clearTimeout(restartTimer);

  clearTimeout(silenceTimer);


  maxRunning=true;

  speaking=false;

  processing=false;

  listening=false;

  conversationMode=false;


  replyBox.textContent="";


  setStatus("Say MAX...");


  if(recognition){

    try{
      recognition.abort();
    }catch(e){}

  }


  recognition=null;


  createRecognition();

  startRecognition();
};


/* =========================
   STOP MAX
========================= */

stopBtn.onclick=()=>{

  maxRunning=false;

  speaking=false;

  processing=false;

  listening=false;

  conversationMode=false;


  clearTimeout(restartTimer);

  clearTimeout(silenceTimer);


  stopRecognition();


  window.speechSynthesis.cancel();


  orb.classList.remove("active");


  setStatus("MAX is sleeping");
};


/* =========================
   TYPED INPUT
========================= */

async function sendTypedMessage(){

  const message=
    input.value.trim();


  if(!message) return;


  input.value="";


  await sendMessage(message);
}


sendBtn.onclick=
  sendTypedMessage;


input.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){

      sendTypedMessage();

    }

  }
);


/* =========================
   CHECK SUPPORT
========================= */

if(!SpeechRecognition){

  setStatus(
    "Voice recognition is not supported in this browser."
  );
}


/*
  Load voices once browser provides them.
*/

window.speechSynthesis.onvoiceschanged=()=>{
  window.speechSynthesis.getVoices();
};

</script>

</body>
  </html>
