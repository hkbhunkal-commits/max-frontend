<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX AI</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:30px 15px;
}

.box{
  max-width:600px;
  margin:40px auto;
  background:#1e293b;
  padding:25px;
  border-radius:20px;
}

#orb{
  width:130px;
  height:130px;
  margin:25px auto;
  border-radius:50%;
  background:#334155;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
}

.listening{
  background:#2563eb !important;
}

.speaking{
  background:#16a34a !important;
}

button{
  border:0;
  border-radius:12px;
  padding:15px 24px;
  margin:8px;
  font-size:17px;
  font-weight:bold;
}

#status{
  margin:20px;
  color:#cbd5e1;
}

#response{
  margin-top:25px;
  text-align:left;
  line-height:1.6;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="box">

<h1>MAX 🤖</h1>

<div id="orb">🤖</div>

<div id="status">
Press START and allow microphone
</div>

<button id="startBtn">
🎤 START MAX
</button>

<div id="response"></div>

</div>

<script>

const BACKEND =
"https://max-backend-u4r6.onrender.com/chat";

const statusBox =
document.getElementById("status");

const orb =
document.getElementById("orb");

const startBtn =
document.getElementById("startBtn");

const responseBox =
document.getElementById("response");


let active = false;
let listening = false;
let speaking = false;


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

  statusBox.textContent =
  "Chrome voice recognition is not supported.";

}else{

  startBtn.onclick = function(){

    if(active){

      stopMAX();

    }else{

      startMAX();

    }

  };


  function startMAX(){

    active = true;

    startBtn.textContent =
    "🛑 STOP MAX";

    statusBox.textContent =
    'Say "MAX"...';

    listen();

  }


  function stopMAX(){

    active = false;
    listening = false;

    try{
      recognition.stop();
    }catch(e){}

    speechSynthesis.cancel();

    startBtn.textContent =
    "🎤 START MAX";

    statusBox.textContent =
    "MAX stopped.";

    orb.className = "";

  }


  const recognition =
  new SpeechRecognition();


  recognition.continuous = false;
  recognition.interimResults = false;


  // English is better for detecting MAX

  recognition.lang = "en-US";


  recognition.onstart = function(){

    listening = true;

    orb.className =
    "listening";

    statusBox.textContent =
    'Listening... say "MAX"';

  };


  recognition.onresult =
  function(event){

    listening = false;

    orb.className = "";


    const heard =
    event.results[0][0].transcript
    .trim();


    console.log(
      "MAX heard:",
      heard
    );


    statusBox.textContent =
    "Heard: " + heard;


    // Wake word test

    const lower =
    heard.toLowerCase();


    if(
      lower === "max" ||
      lower.includes("max")
    ){

      speak(
        "Haan boss."
      );

    }else{

      statusBox.textContent =
      'I heard "' +
      heard +
      '". Say MAX.';

      setTimeout(
        listen,
        700
      );

    }

  };


  recognition.onerror =
  function(event){

    listening = false;

    orb.className = "";

    console.log(
      "MIC ERROR:",
      event.error
    );


    if(event.error === "not-allowed"){

      statusBox.textContent =
      "Microphone permission denied.";

      return;

    }


    if(active){

      setTimeout(
        listen,
        1000
      );

    }

  };


  recognition.onend =
  function(){

    listening = false;

    orb.className = "";


    if(
      active &&
      !speaking
    ){

      setTimeout(
        listen,
        500
      );

    }

  };


  function listen(){

    if(
      !active ||
      listening ||
      speaking
    ){

      return;

    }


    try{

      recognition.start();

    }catch(e){

      console.log(e);

    }

  }


  function speak(text){

    speaking = true;

    orb.className =
    "speaking";

    statusBox.textContent =
    "MAX is speaking...";


    speechSynthesis.cancel();


    const voice =
    new SpeechSynthesisUtterance(
      text
    );


    voice.lang =
    "en-IN";

    voice.rate =
    0.95;

    voice.pitch =
    1;


    voice.onend =
    function(){

      speaking = false;

      orb.className = "";


      if(active){

        statusBox.textContent =
        'Say "MAX"...';

        setTimeout(
          listen,
          500
        );

      }

    };


    voice.onerror =
    function(){

      speaking = false;

      orb.className = "";

      if(active){
        listen();
      }

    };


    speechSynthesis.speak(
      voice
    );

  }

}

</script>

</body>
</html>
