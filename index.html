<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAX AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.box {
    width: 100%;
    max-width: 650px;

    background: #1e293b;
    border-radius: 24px;

    padding: 30px 20px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 34px;
}

.subtitle {
    color: #94a3b8;
    margin-top: 8px;
}

#orb {
    width: 150px;
    height: 150px;

    margin: 30px auto 20px;

    border-radius: 50%;
    background: #334155;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 55px;

    transition: 0.25s;
}

#orb.listening {
    background: #2563eb;
    transform: scale(1.08);
}

#orb.thinking {
    background: #7c3aed;
    transform: scale(1.05);
}

#orb.speaking {
    background: #16a34a;
    transform: scale(1.08);
}

button {
    border: none;
    border-radius: 14px;

    padding: 15px 25px;
    margin: 8px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

#stopBtn {
    display: none;
}

#status {
    min-height: 24px;
    color: #cbd5e1;

    margin: 15px 0;
}

#response {
    margin-top: 25px;

    padding: 18px;

    border-radius: 15px;

    background: #0f172a;

    text-align: left;

    line-height: 1.6;

    white-space: pre-wrap;
}
</style>
</head>


<body>

<div class="box">

    <h1>MAX 🤖</h1>

    <div class="subtitle">
        Your AI Assistant
    </div>

    <div id="orb">
        🤖
    </div>

    <div id="status">
        Press START MAX
    </div>

    <button id="startBtn">
        🎤 START MAX
    </button>

    <button id="stopBtn">
        🛑 STOP
    </button>

    <div id="response"></div>

</div>


<script>

// ==================================================
// BACKEND
// ==================================================

// ELEMENTS
// ==================================================

const orb =
document.getElementById("orb");

document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");


// ==================================================
// VARIABLES
// ==================================================

let recognition = null;

let maxActive = false;

let recognitionRunning = false;

let speaking = false;

let thinking = false;

let waitingForWakeWord = true;

let waitingForCommand = false;

let restartTimer = null;


// ==================================================
// SPEECH RECOGNITION
// ==================================================

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    statusBox.textContent =
    "Voice recognition is not supported. Please use Chrome.";

} else {

    recognition =
    new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang = "en-IN";


    // ----------------------------------------------
    // RECOGNITION START
    // ----------------------------------------------

    recognition.onstart = function() {

        recognitionRunning = true;

        orb.className = "listening";


        if (waitingForCommand) {

            statusBox.textContent =
            "I'm listening... 🎤";

        } else {

            statusBox.textContent =
            'Say "MAX"... 🎤';

        }

    };


    // ----------------------------------------------
    // RECOGNITION RESULT
    // ----------------------------------------------

    recognition.onresult =
    function(event) {

        recognitionRunning = false;

        orb.className = "";


        const text =
        event.results[0][0].transcript.trim();


        console.log(
            "Heard:",
            text
        );


        // ==========================================
        // COMMAND MODE
        // ==========================================

        if (waitingForCommand) {

            waitingForCommand = false;

            waitingForWakeWord = false;

            sendMessage(text);

            return;
        }


        // ==========================================
        // WAKE WORD MODE
        // ==========================================

        const command =
        removeWakeWord(text);


        // User only said MAX

        if (command === "") {

            waitingForWakeWord = false;

            waitingForCommand = true;

            speakHaanBoss();

            return;
        }


        // User said:
        // MAX how are you?

        waitingForWakeWord = false;

        waitingForCommand = false;

        sendMessage(command);

    };


    // ----------------------------------------------
    // RECOGNITION ERROR
    // ----------------------------------------------

    recognition.onerror =
    function(event) {

        recognitionRunning = false;

        orb.className = "";


        console.log(
            "Speech error:",
            event.error
        );


        if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ) {

            statusBox.textContent =
            "Microphone permission denied.";

            maxActive = false;

            return;
        }


        if (
            maxActive &&
            !speaking &&
            !thinking
        ) {

            scheduleListen();

        }

    };


    // ----------------------------------------------
    // RECOGNITION END
    // ----------------------------------------------

    recognition.onend =
    function() {

        recognitionRunning = false;

        orb.className = "";


        console.log(
            "Recognition ended."
        );


        /*
        IMPORTANT:

        Only restart when MAX is genuinely
        waiting for something.

        Never restart while MAX is speaking
        or thinking.
        */

        if (
            maxActive &&
            !speaking &&
            !thinking
        ) {

            scheduleListen();

        }

    };

}


// ==================================================
// START MAX
// ==================================================

startBtn.onclick =
function() {

    startMAX();

};


// ==================================================
// STOP MAX
// ==================================================

stopBtn.onclick =
function() {

    stopMAX();

};


// ==================================================
// START
// ==================================================

function startMAX() {

    if (!recognition) {

        return;
    }


    maxActive = true;

    speaking = false;

    thinking = false;

    waitingForWakeWord = true;

    waitingForCommand = false;


    startBtn.style.display =
    "none";

    stopBtn.style.display =
    "inline-block";


    statusBox.textContent =
    'Say "MAX"... 🎤';


    scheduleListen();

}


// ==================================================
// STOP
// ==================================================

function stopMAX() {

    maxActive = false;

    speaking = false;

    thinking = false;

    waitingForWakeWord = true;

    waitingForCommand = false;


    if (restartTimer) {

        clearTimeout(
            restartTimer
        );

        restartTimer = null;

    }

        recognition.stop();

    } catch(e) {}


    speechSynthesis.cancel();


    recognitionRunning = false;


    orb.className = "";


    startBtn.style.display =
    "inline-block";

    stopBtn.style.display =
    "none";


    statusBox.textContent =
    "MAX stopped.";

}


// ==================================================
// SCHEDULE LISTEN
// ==================================================

function scheduleListen() {

    if (
        !maxActive ||
        speaking ||
        thinking ||
        recognitionRunning
    ) {

        return;
    }


    if (restartTimer) {

        clearTimeout(
            restartTimer
        );

    }


    restartTimer =
    setTimeout(
        function() {

            restartTimer = null;

            startListening();

        },
        600
    );

}


// ==================================================
// START LISTENING
// ==================================================

function startListening() {

    if (
        !maxActive ||
        speaking ||
        thinking ||
        recognitionRunning
    ) {

        return;
    }


    try {

        recognition.start();

    } catch(error) {

        console.log(
            "Could not start recognition:",
            error
        );

    }

}


// ==================================================
// REMOVE MAX
// ==================================================

function removeWakeWord(text) {

    let clean =
    text
    .trim();


    /*
    Handles:

    MAX
    max
    hey max
    okay max
    ok max
    MAX how are you
    */

    clean =
    clean.replace(
        /^(hey|okay|ok)?\s*max[\s,.\-:]*/i,
        ""
    );


    return clean.trim();

}
