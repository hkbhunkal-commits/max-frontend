<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      padding: 25px;
      text-align: center;
    }

    h1 {
      font-size: 55px;
      margin: 10px 0;
      letter-spacing: 5px;
    }

    .status {
      margin: 15px 0;
      color: #aaa;
      min-height: 24px;
    }

    .orb {
      width: 170px;
      height: 170px;
      margin: 30px auto;
      border-radius: 50%;
      background: radial-gradient(circle, #444, #111 65%, #000);
      box-shadow: 0 0 40px #222;
      transition: 0.3s;
    }

    .orb.active {
      box-shadow: 0 0 60px #777;
      transform: scale(1.05);
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 14px 28px;
      font-size: 17px;
      margin: 8px;
      cursor: pointer;
      background: white;
      color: black;
    }

    input {
      width: 90%;
      padding: 14px;
      border-radius: 25px;
      border: 1px solid #444;
      background: #151515;
      color: white;
      outline: none;
      font-size: 16px;
    }

    .reply {
      margin-top: 25px;
      min-height: 50px;
      font-size: 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>MAX</h1>

  <div id="status" class="status">
    Press START MAX
  </div>

  <div id="orb" class="orb"></div>

  <button id="startBtn">START MAX</button>

  <div>
    <input
      id="textInput"
      type="text"
      placeholder="Type something..."
    >
    <button id="sendBtn">SEND</button>
  </div>

  <div id="reply" class="reply"></div>

</div>

<script>

const BACKEND = "https://max-backend-u4r6.onrender.com";

let recognition = null;

let maxRunning = false;
let listening = false;
let speaking = false;
let processing = false;

let conversationMode = false;

let silenceTimer = null;
let restartTimer = null;


/* ---------------- STATUS ---------------- */

function setStatus(text) {
  document.getElementById("status").textContent = text;
}


/* ---------------- ORB ---------------- */

function setOrb(active) {
  document.getElementById("orb").classList.toggle("active", active);
}


/* ---------------- SPEAK ---------------- */

function speak(text) {

  if (!text) {
    startListening();
    return;
  }

  speaking = true;
  listening = false;

  stopRecognition();

  setOrb(true);
  setStatus("MAX बोल रहा है...");

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  // Hindi/Hinglish detection
  const hindiPattern =
    /[\u0900-\u097F]|hai|haan|boss|bro|kaise|kya|mujhe|aap|mera|meri|ye|yeh|nahi|nahin|kr|kar|bata|bta|acha|achha|hoga|chahiye/i;

  if (hindiPattern.test(text)) {
    utterance.lang = "hi-IN";
  } else {
    utterance.lang = "en-IN";
  }

  utterance.rate = 0.95;
  utterance.pitch = 1;

  const voices = window.speechSynthesis.getVoices();

  let selectedVoice = null;

  if (utterance.lang === "hi-IN") {
    selectedVoice =
      voices.find(v => v.lang === "hi-IN") ||
      voices.find(v => v.lang.startsWith("hi"));
  } else {
    selectedVoice =
      voices.find(v => v.lang === "en-IN") ||
      voices.find(v => v.lang.startsWith("en"));
  }

  if (selectedVoice) {
    utterance.voice = selectedVoice;
  }

  utterance.onend = function () {

    speaking = false;
    setOrb(false);

    // IMPORTANT:
    // Conversation mode stays ON after every answer.
    if (maxRunning && conversationMode) {
      setStatus("Listening...");
      startListening();
    } else if (maxRunning) {
      setStatus("Say MAX...");
      startListening();
    }
  };

  utterance.onerror = function () {

    speaking = false;
    setOrb(false);

    if (maxRunning) {
      startListening();
    }
  };

  window.speechSynthesis.speak(utterance);
}


/* ---------------- STOP RECOGNITION ---------------- */

function stopRecognition() {

  if (!recognition) return;

  try {
    recognition.abort();
  } catch (e) {}

  listening = false;
}


/* ---------------- START RECOGNITION ---------------- */

function startListening() {

  if (!maxRunning) return;
  if (speaking) return;
  if (processing) return;
  if (listening) return;

  if (!recognition) {
    createRecognition();
  }

  clearTimeout(restartTimer);

  restartTimer = setTimeout(() => {

    if (!maxRunning) return;
    if (speaking) return;
    if (processing) return;
    if (listening) return;

    try {
      recognition.start();
    } catch (e) {}

  }, 300);

}


/* ---------------- RECOGNITION ---------------- */

function createRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    setStatus(
      "Speech recognition supported nahi hai. Chrome use karo."
    );

    return;
  }

  recognition = new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = false;

  // Indian English works well for Hinglish
  recognition.lang = "en-IN";


  recognition.onstart = function () {

    listening = true;

    setOrb(true);

    if (conversationMode) {
      setStatus("Listening...");
    } else {
      setStatus("Say MAX...");
    }

    startSilenceTimer();
  };


  recognition.onresult = async function(event) {

    clearSilenceTimer();

    listening = false;

    const text =
      event.results[event.results.length - 1][0].transcript.trim();

    if (!text) {
      startListening();
      return;
    }

    console.log("Heard:", text);

    await handleVoice(text);
  };


  recognition.onerror = function(event) {

    console.log("Speech error:", event.error);

    listening = false;

    clearSilenceTimer();

    if (!maxRunning || speaking || processing) {
      return;
    }

    // Don't exit conversation mode on normal speech errors.
    startListening();
  };


  recognition.onend = function() {

    listening = false;

    clearSilenceTimer();

    if (!maxRunning) return;
    if (speaking) return;
    if (processing) return;

    // VERY IMPORTANT:
    // If conversation mode is ON,
    // immediately listen again.
    if (conversationMode) {
      setStatus("Listening...");
      startListening();
    } else {
      setStatus("Say MAX...");
      startListening();
    }
  };

}


/* ---------------- SILENCE TIMER ---------------- */

function startSilenceTimer() {

  clearSilenceTimer();

  silenceTimer = setTimeout(() => {

    if (!maxRunning) return;
    if (speaking || processing) return;

    // Only leave conversation mode after
    // 12 seconds of complete silence.
    conversationMode = false;

    setStatus("Say MAX...");

  }, 12000);
}


function clearSilenceTimer() {

  if (silenceTimer) {
    clearTimeout(silenceTimer);
    silenceTimer = null;
  }

}


/* ---------------- VOICE HANDLER ---------------- */

async function handleVoice(text) {

  clearSilenceTimer();

  setOrb(false);

  const lower = text.toLowerCase().trim();


  /*
    WAKE WORD MODE

    If conversation mode is OFF,
    MAX requires "MAX" / "Hello MAX".
  */

  if (!conversationMode) {

    const wakeWords = [
      "max",
      "hello max",
      "hey max",
      "hello max."
    ];

    const containsWakeWord =
      wakeWords.some(word => lower.includes(word));

    if (!containsWakeWord) {

      // Ignore random speech while waiting for MAX.
      startListening();

      return;
    }

    // Wake word detected.
    conversationMode = true;

    setStatus("Haan boss.");

    speak("Haan boss.");

    return;
  }


  /*
    CONVERSATION MODE

    Here MAX DOES NOT require wake word.

    Example:

    Hello MAX
    → Haan boss.

    Capital of USA?
    → Washington, D.C.

    Capital of India?
    → New Delhi

    No "MAX" needed.
  */

  await sendToBackend(text);

}


/* ---------------- BACKEND ---------------- */

async function sendToBackend(message) {

  if (!message) return;

  processing = true;

  stopRecognition();

  setOrb(true);
  setStatus("Thinking...");

  document.getElementById("reply").textContent = "";


  try {

    const response = await fetch(
      `${BACKEND}/chat`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message,
          userId: "default-user"
        })
      }
    );


    if (!response.ok) {
      throw new Error("Backend error");
    }


    const data = await response.json();

    const answer =
      data.reply ||
      data.message ||
      "Sorry boss, mujhe answer nahi mila.";


    document.getElementById("reply").textContent = answer;


    processing = false;

    setOrb(false);


    /*
      KEEP CONVERSATION MODE ON.

      This is the main fix.
    */

    if (maxRunning) {

      conversationMode = true;

      speak(answer);

    }


  } catch (error) {

    console.error(error);

    processing = false;

    setOrb(false);

    const errorText =
      "Boss, backend se connection nahi ho pa raha.";

    document.getElementById("reply").textContent = errorText;

    if (maxRunning) {

      conversationMode = true;

      speak(errorText);

    }

  }

}


/* ---------------- START BUTTON ---------------- */

document
  .getElementById("startBtn")
  .addEventListener("click", function() {

    if (maxRunning) {

      maxRunning = false;
      conversationMode = false;

      clearSilenceTimer();
      clearTimeout(restartTimer);

      stopRecognition();

      window.speechSynthesis.cancel();

      speaking = false;
      processing = false;

      setOrb(false);
      setStatus("MAX stopped.");

      this.textContent = "START MAX";

      return;
    }


    maxRunning = true;
    conversationMode = false;

    this.textContent = "STOP MAX";

    setStatus("Say MAX...");

    createRecognition();
    startListening();

  });


/* ---------------- TEXT SEND ---------------- */

document
  .getElementById("sendBtn")
  .addEventListener("click", async function() {

    const input =
      document.getElementById("textInput");

    const text = input.value.trim();

    if (!text) return;

    input.value = "";

    // Typed messages also activate conversation mode.
    if (maxRunning) {
      conversationMode = true;
    }

    await sendToBackend(text);

  });


/* Enter key */

document
  .getElementById("textInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      document
        .getElementById("sendBtn")
        .click();

    }

  });


/* ---------------- VOICE LOAD ---------------- */

window.speechSynthesis.onvoiceschanged = function() {
  window.speechSynthesis.getVoices();
};

</script>

</body>
</html>
