<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 92%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .status {
      color: #aaa;
      margin-bottom: 25px;
    }

    .orb {
      width: 150px;
      height: 150px;
      margin: 20px auto;
      border-radius: 50%;
      background: radial-gradient(circle, #5ee7ff, #1769ff, #10152b);
      box-shadow: 0 0 50px #1769ff;
    }

    .active {
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    button {
      border: none;
      border-radius: 25px;
      padding: 14px 25px;
      margin: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    #startBtn {
      background: #1769ff;
      color: white;
    }

    #stopBtn {
      background: #333;
      color: white;
    }

    .box {
      margin-top: 25px;
      padding: 18px;
      background: #151a22;
      border-radius: 15px;
      text-align: left;
      min-height: 100px;
    }

    .label {
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    #reply {
      line-height: 1.5;
    }

    .inputArea {
      display: flex;
      margin-top: 15px;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 15px;
    }

    #sendBtn {
      background: #1769ff;
      color: white;
      margin: 0;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>MAX</h1>

  <div class="status" id="status">
    Press START MAX
  </div>

  <div class="orb" id="orb"></div>

  <button id="startBtn">START MAX</button>
  <button id="stopBtn">STOP</button>

  <div class="box">
    <div class="label">YOU</div>
    <div id="userText">—</div>

    <br>

    <div class="label">MAX</div>
    <div id="reply">—</div>
  </div>

  <div class="inputArea">
    <input
      id="textInput"
      type="text"
      placeholder="Type to MAX..."
    >

    <button id="sendBtn">Send</button>
  </div>

</div>


<script>

const BACKEND =
  "https://max-backend-u4r6.onrender.com/chat";


const statusText =
  document.getElementById("status");

const orb =
  document.getElementById("orb");

const userText =
  document.getElementById("userText");

const replyText =
  document.getElementById("reply");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const textInput =
  document.getElementById("textInput");

const sendBtn =
  document.getElementById("sendBtn");


let recognition = null;

let running = false;

let listeningForCommand = false;

let speaking = false;


// =========================
// SPEECH RECOGNITION
// =========================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.lang = "en-IN";


  recognition.onstart = () => {

    if (!running) return;

    statusText.textContent =
      listeningForCommand
        ? "Listening to your command..."
        : "Say MAX...";

    orb.classList.add("active");
  };


  recognition.onresult = async (event) => {

    const text =
      event.results[0][0].transcript.trim();

    if (!text) return;


    userText.textContent = text;


    // =========================
    // WAKE WORD
    // =========================

    if (!listeningForCommand) {

      const lower =
        text.toLowerCase();

      if (
        lower === "max" ||
        lower.startsWith("max ")
      ) {

        listeningForCommand = true;

        recognition.stop();

        await speak("Haan boss.");

        if (running) {

          setTimeout(() => {

            startListening();

          }, 300);

        }

      }

      return;
    }


    // =========================
    // COMMAND
    // =========================

    listeningForCommand = false;

    recognition.stop();

    await askMAX(text);

  };


  recognition.onerror = (event) => {

    console.log(
      "Speech error:",
      event.error
    );

    if (!running) return;

    if (event.error === "not-allowed") {

      statusText.textContent =
        "Microphone permission required.";

      return;
    }

    setTimeout(() => {

      if (running && !speaking) {
        startListening();
      }

    }, 700);

  };


  recognition.onend = () => {

    orb.classList.remove("active");

    if (
      running &&
      !speaking
    ) {

      setTimeout(() => {

        startListening();

      }, 400);

    }

  };

}


// =========================
// START LISTENING
// =========================

function startListening() {

  if (!recognition) {

    statusText.textContent =
      "Speech recognition is not supported in this browser.";

    return;
  }

  if (!running || speaking) return;


  try {

    recognition.start();

  } catch (error) {

    console.log(error);

  }

}


// =========================
// SPEAK
// =========================

function speak(text) {

  return new Promise((resolve) => {

    if (!("speechSynthesis" in window)) {

      resolve();

      return;
    }


    speechSynthesis.cancel();

    speaking = true;

    statusText.textContent =
      "MAX is speaking...";


    // Remove markdown
    let clean =
      text
        .replace(/\*\*/g, "")
        .replace(/\*/g, "")
        .replace(/__/g, "")
        .replace(/_/g, "")
        .replace(/`/g, "")
        .replace(/#{1,6}\s?/g, "")
        .replace(/\n+/g, " ")
        .replace(/\s+/g, " ")
        .trim();


    // Remove emojis
    clean =
      clean.replace(
        /[\u{1F300}-\u{1FAFF}]/gu,
        ""
      );


    const utterance =
      new SpeechSynthesisUtterance(clean);


    // Hindi / Hinglish voice
    if (/[\u0900-\u097F]/.test(clean)) {

      utterance.lang = "hi-IN";

    } else {

      utterance.lang = "en-IN";

    }


    utterance.rate = 1.05;

    utterance.pitch = 1;


    utterance.onend = () => {

      speaking = false;

      statusText.textContent =
        running
          ? "Say MAX..."
          : "MAX stopped";

      resolve();

    };


    utterance.onerror = () => {

      speaking = false;

      resolve();

    };


    speechSynthesis.speak(
      utterance
    );

  });

}


// =========================
// ASK MAX
// =========================

async function askMAX(message) {

  statusText.textContent =
    "Thinking...";

  orb.classList.add("active");


  try {

    const response =
      await fetch(BACKEND, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "MAX error"
      );

    }


    const reply =
      data.reply || "Sorry bro.";


    replyText.textContent =
      reply;


    await speak(reply);


  } catch (error) {

    console.error(error);

    const errorMessage =
      "Sorry bro, connection problem hai.";

    replyText.textContent =
      errorMessage;

    await speak(errorMessage);

  }

}


// =========================
// START BUTTON
// =========================

startBtn.onclick = () => {

  running = true;

  listeningForCommand = false;

  statusText.textContent =
    "Say MAX...";

  startListening();

};


// =========================
// STOP BUTTON
// =========================

stopBtn.onclick = () => {

  running = false;

  listeningForCommand = false;

  speaking = false;


  if (recognition) {

    try {
      recognition.stop();
    } catch (e) {}

  }


  speechSynthesis.cancel();


  orb.classList.remove("active");

  statusText.textContent =
    "MAX stopped";

};


// =========================
// TEXT SEND
// =========================

sendBtn.onclick = async () => {

  const message =
    textInput.value.trim();


  if (!message) return;


  userText.textContent =
    message;


  textInput.value = "";


  await askMAX(message);

};


textInput.addEventListener(
  "keydown",
  (event) => {

    if (event.key === "Enter") {

      sendBtn.click();

    }

  }
);

</script>

</body>
</html>
