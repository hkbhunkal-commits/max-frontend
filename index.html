<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAX AI</title>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 25px;
    }

    #orb {
      width: 120px;
      height: 120px;
      margin: 20px auto;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      transition: 0.3s;
    }

    #orb.listening {
      background: #2563eb;
      transform: scale(1.08);
    }

    #orb.speaking {
      background: #16a34a;
      transform: scale(1.08);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      margin: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #voiceBtn {
      font-size: 22px;
      padding: 18px 28px;
    }

    #status {
      margin: 15px;
      color: #cbd5e1;
    }

    #response {
      margin-top: 25px;
      text-align: left;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    #msg {
      width: 90%;
      box-sizing: border-box;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>MAX 🤖</h1>

    <div id="orb">🤖</div>

    <div id="status">
      Tap the microphone and talk
    </div>

    <button id="voiceBtn" onclick="startVoice()">
      🎤 Talk to MAX
    </button>

    <br>

    <input
      id="msg"
      type="text"
      placeholder="Or type a message..."
    >

    <br>

    <button onclick="sendTypedMessage()">
      Send
    </button>

    <div id="response"></div>

  </div>


<script>

const BACKEND =
  "https://max-backend-u4r6.onrender.com/chat";

const msgInput =
  document.getElementById("msg");

const responseBox =
  document.getElementById("response");

const statusBox =
  document.getElementById("status");

const orb =
  document.getElementById("orb");

const voiceBtn =
  document.getElementById("voiceBtn");


let recognition = null;
let isSpeaking = false;


// ============================
// SPEECH RECOGNITION
// ============================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.lang = "en-IN";


  recognition.onstart = function () {

    orb.classList.add("listening");

    statusBox.textContent =
      "Listening... 🎤";

    voiceBtn.textContent =
      "🔴 Listening";

  };


  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    msgInput.value = text;

    orb.classList.remove("listening");

    statusBox.textContent =
      "Thinking... 🧠";

    sendMessage(text);

  };


  recognition.onerror = function(event) {

    console.log(event.error);

    orb.classList.remove("listening");

    statusBox.textContent =
      "Mic error. Try again.";

    voiceBtn.textContent =
      "🎤 Talk to MAX";

  };


  recognition.onend = function() {

    orb.classList.remove("listening");

    voiceBtn.textContent =
      "🎤 Talk to MAX";

  };

}


// ============================
// START VOICE
// ============================

function startVoice() {

  if (!recognition) {

    statusBox.textContent =
      "Voice input is not supported.";

    return;

  }

  // Stop MAX if he is speaking
  if (isSpeaking) {

    window.speechSynthesis.cancel();

    isSpeaking = false;

    orb.classList.remove("speaking");

  }

  try {

    recognition.start();

  } catch(error) {

    console.log(error);

  }

}


// ============================
// SEND TYPED MESSAGE
// ============================

function sendTypedMessage() {

  const text =
    msgInput.value.trim();

  if (!text) {
    return;
  }

  sendMessage(text);

}


// ============================
// SEND TO MAX
// ============================

async function sendMessage(message) {

  try {

    responseBox.innerHTML =
      "<b>MAX:</b> Thinking...";

    statusBox.textContent =
      "MAX is thinking... 🧠";


    const res =
      await fetch(
        BACKEND,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        }
      );


    const data =
      await res.json();


    if (!res.ok) {

      throw new Error(
        data.error || "Server error"
      );

    }


    const reply =
      data.reply || "";


    // Show complete reply
    responseBox.innerHTML =
      "<b>MAX:</b> " +
      escapeHtml(reply);


    // Speak naturally
    speakMAX(reply);


  } catch(error) {

    responseBox.innerHTML =
      "<b>Error:</b> " +
      escapeHtml(error.message);

    statusBox.textContent =
      "Something went wrong.";

  }

}
