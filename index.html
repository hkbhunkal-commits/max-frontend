<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAX AI Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.box {
    width: 100%;
    max-width: 650px;

    background: #1e293b;
    border-radius: 24px;

    padding: 30px 20px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 34px;
}

.subtitle {
    color: #94a3b8;
    margin-top: 8px;
}

#orb {
    width: 150px;
    height: 150px;

    margin: 30px auto 20px;

    border-radius: 50%;
    background: #334155;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 55px;

    transition: 0.2s;
}

#orb.listening {
    background: #2563eb;
    transform: scale(1.08);
}

#orb.thinking {
    background: #7c3aed;
    transform: scale(1.05);
}

#orb.speaking {
    background: #16a34a;
    transform: scale(1.08);
}

button {
    border: none;
    border-radius: 14px;

    padding: 15px 25px;
    margin: 8px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

#stopBtn {
    display: none;
}

#status {
    min-height: 24px;
    color: #cbd5e1;
    margin: 15px 0;
}

#response {
    margin-top: 25px;

    padding: 18px;

    border-radius: 15px;

    background: #0f172a;

    text-align: left;

    line-height: 1.6;

    white-space: pre-wrap;

    max-height: 300px;
    overflow-y: auto;
}
</style>
</head>


<body>

<div class="box">

    <h1>MAX 🤖</h1>

    <div class="subtitle">
        Your AI Assistant
    </div>

    <div id="orb">
        🤖
    </div>

    <div id="status">
        Press START MAX
    </div>

    <button id="startBtn">
        🎤 START MAX
    </button>

    <button id="stopBtn">
        🛑 STOP
    </button>

    <div id="response"></div>

</div>


<script>

// ==================================================
// BACKEND
// ==================================================

const BACKEND =
"https://max-backend-u4r6.onrender.com/chat";


// ==================================================
// ELEMENTS
// ==================================================

const orb =
document.getElementById("orb");

const statusBox =
document.getElementById("status");

const responseBox =
document.getElementById("response");

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");


// ==================================================
// STATE
// ==================================================

let recognition = null;

let maxActive = false;

let recognitionRunning = false;

let thinking = false;

let speaking = false;

let restarting = false;

let requestInProgress = false;

let lastHeard = "";

let lastHeardTime = 0;


// ==================================================
// SPEECH RECOGNITION
// ==================================================

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    statusBox.textContent =
    "Voice recognition needs Chrome.";

} else {

    recognition =
    new SpeechRecognition();

    recognition.continuous = true;

    recognition.interimResults = false;

    recognition.lang = "en-IN";


    // ==============================================
    // MIC START
    // ==============================================

    recognition.onstart = function() {

        recognitionRunning = true;

        restarting = false;

        orb.className = "listening";

        statusBox.textContent =
        "I'm listening... 🎤";

    };


    // ==============================================
    // SPEECH RESULT
    // ==============================================

    recognition.onresult =
    async function(event) {

        if (!maxActive) {
            return;
        }


        /*
        Get only the newest final result.
        */

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            if (
                !event.results[i].isFinal
            ) {
                continue;
            }


            let text =
            event.results[i][0].transcript
            .trim();


            if (!text) {
                continue;
            }


            console.log(
                "MAX heard:",
                text
            );


            // ======================================
            // DUPLICATE PROTECTION
            // ======================================

            const now =
            Date.now();


            if (
                text.toLowerCase() ===
                lastHeard.toLowerCase() &&
                now - lastHeardTime < 2500
            ) {

                continue;

            }


            lastHeard = text;

            lastHeardTime = now;


            // ======================================
            // BARGE-IN
            // ======================================

            if (speaking) {

                /*
                User started talking while MAX
                was speaking.

                Stop MAX immediately.
                */

                speechSynthesis.cancel();

                speaking = false;

                orb.className =
                "thinking";

                statusBox.textContent =
                "Got it... 🎤";

            }


            // ======================================
            // IGNORE IF AI IS ALREADY PROCESSING
            // ======================================

            if (requestInProgress) {

                continue;

            }


            // ======================================
            // SEND USER MESSAGE
            // ======================================

            await sendMessage(text);

        }

    };


    // ==============================================
    // ERROR
    // ==============================================

    recognition.onerror =
    function(event) {

        recognitionRunning = false;


        console.log(
            "Recognition error:",
            event.error
        );


        if (!maxActive) {
            return;
        }


        if (
            event.error ===
            "not-allowed" ||
            event.error ===
            "service-not-allowed"
        ) {

            statusBox.textContent =
            "Microphone permission denied.";

            maxActive = false;

            startBtn.style.display =
            "inline-block";

            stopBtn.style.display =
            "none";

            return;
        }


        restartRecognition();

    };


    // ==============================================
    // RECOGNITION END
    // ==============================================

    recognition.onend =
    function() {

        recognitionRunning = false;


        if (!maxActive) {
            return;
        }


        /*
        Chrome sometimes stops continuous recognition.
        Automatically start it again.
        */

        restartRecognition();

    };

}


// ==================================================
// START MAX
// ==================================================

startBtn.onclick =
function() {

    startMAX();

};


// ==================================================
// STOP MAX
// ==================================================

stopBtn.onclick =
function() {

    stopMAX();

};


// ==================================================
// START
// ==================================================

function startMAX() {

    if (!recognition) {
        return;
    }


    maxActive = true;

    thinking = false;

    speaking = false;

    requestInProgress = false;

    lastHeard = "";

    lastHeardTime = 0;


    speechSynthesis.cancel();


    startBtn.style.display =
    "none";

    stopBtn.style.display =
    "inline-block";


    statusBox.textContent =
    "Starting MAX... 🎤";


    responseBox.innerHTML = "";


    startRecognition();

}


// ==================================================
// START RECOGNITION
// ==================================================

function startRecognition() {

    if (
        !maxActive ||
        recognitionRunning ||
        restarting
    ) {

        return;

    }


    restarting = true;


    setTimeout(function() {

        restarting = false;


        if (
            !maxActive ||
            recognitionRunning
        ) {

            return;

        }


        try {

            recognition.start();

        }

        catch(error) {

            console.log(
                "Recognition start:",
                error
            );

        }

    }, 400);

}


// ==================================================
// RESTART RECOGNITION
// ==================================================

function restartRecognition() {

    if (
        !maxActive ||
        recognitionRunning ||
        restarting
    ) {

        return;

    }


    startRecognition();

}


// ==================================================
// STOP MAX
// ==================================================

function stopMAX() {

    maxActive = false;

    thinking = false;

    speaking = false;

    requestInProgress = false;

    restarting = false;


    speechSynthesis.cancel();


    try {

        recognition.stop();

    }

    catch(error) {}


    recognitionRunning = false;


    orb.className = "";


    startBtn.style.display =
    "inline-block";

    stopBtn.style.display =
    "none";


    statusBox.textContent =
    "MAX stopped.";

}


// ==================================================
// SEND TO AI
// ==================================================

async function sendMessage(message) {

    if (!message) {
        return;
    }


    requestInProgress = true;

    thinking = true;

    speaking = false;


    /*
    Stop recognition temporarily while sending
    the request. This prevents multiple requests.
    */

    try {

        recognition.stop();

    }

    catch(error) {}


    recognitionRunning = false;


    orb.className =
    "thinking";


    statusBox.textContent =
    "Thinking... 🧠";


    responseBox.innerHTML =
    "<b>You:</b> " +
    escapeHtml(message) +

    "<br><br>" +

    "<b>MAX:</b> Thinking...";


    try {

        const response =
        await fetch(

            BACKEND,

            {

                method: "POST",

                headers: {

                    "Content-Type":
                    "application/json"

                },

                body: JSON.stringify({

                    message: message

                })

            }

        );


        const data =
        await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "MAX server error"
            );

        }


        const reply =
        data.reply || "";


        thinking = false;

        requestInProgress = false;


        responseBox.innerHTML =
        "<b>You:</b> " +
        escapeHtml(message) +

        "<br><br>" +

        "<b>MAX:</b> " +
        escapeHtml(reply);


        speakReply(reply);

    }

    catch(error) {

        thinking = false;

        requestInProgress = false;

        speaking = false;


        orb.className = "";


        responseBox.innerHTML =
        "<b>Error:</b> " +
        escapeHtml(
            error.message
        );


        statusBox.textContent =
        "Something went wrong.";


        if (maxActive) {

            startRecognition();

        }

    }

}

// SPEAK RESPONSE
// ==================================================

function speakReply(text) {
