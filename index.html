<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX AI</title>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }

    .box {
      max-width: 600px;
      margin: 50px auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 25px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    input {
      flex: 1;
      min-width: 0;
      box-sizing: border-box;
      padding: 13px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #micBtn {
      margin-top: 0;
      width: 52px;
      padding: 12px 0;
      font-size: 20px;
    }

    #sendBtn {
      margin-top: 15px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #cbd5e1;
    }

    #response {
      margin-top: 25px;
      text-align: left;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>MAX AI 🤖</h1>

    <div class="input-row">
      <input
        id="msg"
        type="text"
        placeholder="Ask MAX anything..."
      >

      <button id="micBtn" onclick="startVoiceInput()">🎤</button>
    </div>

    <button id="sendBtn" onclick="sendMessage()">Send</button>

    <div id="status"></div>

    <div id="response"></div>
  </div>

  <script>
    const input = document.getElementById("msg");
    const micBtn = document.getElementById("micBtn");
    const statusBox = document.getElementById("status");

    // Browser Speech Recognition
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();

      recognition.continuous = false;
      recognition.interimResults = false;

      // Automatically detect common Indian speech
      recognition.lang = "en-IN";

      recognition.onstart = function () {
        micBtn.textContent = "🔴";
        statusBox.textContent = "Listening... 🎤";
      };

      recognition.onresult = function (event) {
        const transcript =
          event.results[0][0].transcript;

        input.value = transcript;

        statusBox.textContent =
          "Voice captured ✅";
      };

      recognition.onerror = function (event) {
        console.error("Speech error:", event.error);

        statusBox.textContent =
          "Mic error: " + event.error;

        micBtn.textContent = "🎤";
      };

      recognition.onend = function () {
        micBtn.textContent = "🎤";
      };

    } else {
      micBtn.disabled = true;

      statusBox.textContent =
        "Voice input is not supported in this browser.";
    }


    function startVoiceInput() {
      if (!recognition) {
        return;
      }

      try {
        recognition.start();
      } catch (error) {
        console.log(error);
      }
    }


    async function sendMessage() {
      const button =
        document.getElementById("sendBtn");

      const responseBox =
        document.getElementById("response");

      const msg = input.value.trim();

      if (!msg) {
        responseBox.innerHTML =
          "<b>Please type or speak a message.</b>";
        return;
      }

      button.disabled = true;

      responseBox.innerHTML =
        "MAX is thinking... 🤔";

      try {
        const res = await fetch(
          "https://max-backend-u4r6.onrender.com/chat",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: msg
            })
          }
        );

        const data = await res.json();

        if (!res.ok) {
          throw new Error(
            data.error || "Server error"
          );
        }

        responseBox.innerHTML =
          "<b>MAX:</b> " +
          escapeHtml(data.reply);

      } catch (error) {

        responseBox.innerHTML =
          "<b>Error:</b> " +
          escapeHtml(error.message);

      }

      button.disabled = false;
    }


    function escapeHtml(text) {
      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    // Press Enter to send
    input.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );
  </script>

</body>
</html>
