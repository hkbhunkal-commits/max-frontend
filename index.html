<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 42px;
      letter-spacing: 4px;
    }

    #status {
      margin-top: 10px;
      color: #aaa;
      text-align: center;
      min-height: 24px;
    }

    .orb {
      width: 180px;
      height: 180px;
      margin: 70px 0 35px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #777 35%, #111 70%);
      box-shadow: 0 0 50px rgba(255,255,255,.25);
      transition: .3s;
    }

    .orb.active {
      box-shadow: 0 0 80px rgba(255,255,255,.6);
      transform: scale(1.05);
    }

    button {
      width: 220px;
      padding: 15px;
      border: none;
      border-radius: 30px;
      margin: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    #startBtn {
      background: white;
      color: black;
    }

    #stopBtn {
      background: #333;
      color: white;
    }

    .chat {
      width: 100%;
      margin-top: 30px;
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      padding: 13px;
      border-radius: 20px;
      border: 1px solid #444;
      background: #17171c;
      color: white;
      outline: none;
    }

    #sendBtn {
      width: 70px;
      margin: 0;
      padding: 10px;
      background: white;
      color: black;
    }

    #reply {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: #15151a;
      border-radius: 15px;
      min-height: 50px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>MAX</h1>

  <div id="status">MAX is sleeping</div>

  <div id="orb" class="orb"></div>

  <button id="startBtn">START MAX</button>
  <button id="stopBtn">STOP MAX</button>

  <div class="chat">
    <input id="input" type="text" placeholder="Type to MAX...">
    <button id="sendBtn">Send</button>
  </div>

  <div id="reply"></div>

</div>

<script>

const BACKEND = "https://max-backend-u4r6.onrender.com";

const statusText = document.getElementById("status");
const orb = document.getElementById("orb");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const replyBox = document.getElementById("reply");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

let maxRunning = false;
let listening = false;
let speaking = false;
let processing = false;

let wakeMode = true;

let lastReply = "";
let lastReplyTime = 0;

if (!SpeechRecognition) {
  statusText.textContent =
    "Voice recognition is not supported in this browser.";
}

function setStatus(text) {
  statusText.textContent = text;
}

function cleanSpeech(text) {

  return text
    .replace(/```[\s\S]*?```/g, "")
    .replace(/[*_#`]/g, "")
    .replace(/[-•]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function stopRecognition() {

  if (!recognition) return;

  try {
    recognition.onend = null;
    recognition.stop();
  } catch (e) {}

  listening = false;
}

function startRecognition() {

  if (!maxRunning) return;
  if (speaking) return;
  if (processing) return;
  if (listening) return;

  if (!recognition) {
    createRecognition();
  }

  try {
    listening = true;
    recognition.start();
  } catch (e) {
    listening = false;
  }
}

function createRecognition() {

  recognition = new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = false;

  // Indian English/Hinglish recognition
  recognition.lang = "en-IN";

  recognition.onstart = () => {

    listening = true;

    if (wakeMode) {
      setStatus("Say MAX...");
    } else {
      setStatus("Listening...");
    }

    orb.classList.add("active");
  };

  recognition.onresult = async (event) => {

    const text =
      event.results[0][0].transcript.trim();

    listening = false;
    orb.classList.remove("active");

    if (!text) {
      restartAfterListening();
      return;
    }

    console.log("Heard:", text);

    // IMPORTANT:
    // Ignore anything while MAX is speaking.
    if (speaking || processing) {
      return;
    }

    // WAKE WORD MODE
    if (wakeMode) {

      const lower = text.toLowerCase();

      if (
        lower === "max" ||
        lower.includes("max")
      ) {

        wakeMode = false;

        setStatus("Haan boss...");

        await speak("Haan boss.");

        if (maxRunning) {
          setTimeout(() => {
            startCommandListening();
          }, 600);
        }

      } else {

        restartAfterListening();
      }

      return;
    }

    // COMMAND MODE
    await sendMessage(text);
  };

  recognition.onerror = (event) => {

    console.log("Speech error:", event.error);

    listening = false;
    orb.classList.remove("active");

    if (!maxRunning) return;

    if (event.error === "not-allowed") {
      setStatus("Microphone permission required.");
      return;
    }

    restartAfterListening();
  };

  recognition.onend = () => {

    listening = false;
    orb.classList.remove("active");

    if (!maxRunning) return;

    if (speaking || processing) return;

    restartAfterListening();
  };
}

function restartAfterListening() {

  if (!maxRunning) return;
  if (speaking) return;
  if (processing) return;

  setTimeout(() => {

    if (!maxRunning) return;
    if (speaking || processing) return;

    startRecognition();

  }, 500);
}

function startCommandListening() {

  if (!maxRunning) return;

  wakeMode = false;

  setStatus("Listening for your command...");

  setTimeout(() => {
    startRecognition();
  }, 300);
}

async function sendMessage(message) {

  if (!message) return;
  if (processing) return;
  if (speaking) return;

  processing = true;

  stopRecognition();

  setStatus("Thinking...");

  try {

    const response = await fetch(
      `${BACKEND}/chat`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Server error");
    }

    let reply = cleanSpeech(data.reply);

    // Prevent duplicate response loop
    const now = Date.now();

    if (
      reply === lastReply &&
      now - lastReplyTime < 5000
    ) {

      processing = false;
      wakeMode = true;

      setStatus("Say MAX...");

      restartAfterListening();

      return;
    }

    lastReply = reply;
    lastReplyTime = now;

    replyBox.textContent = reply;

    processing = false;

    // MAX speaks ONLY once
    await speak(reply);

    // Return to wake-word mode
    wakeMode = true;

    if (maxRunning) {

      setStatus("Say MAX...");

      setTimeout(() => {

        if (!speaking && !processing) {
          startRecognition();
        }

      }, 800);
    }

  } catch (error) {

    console.error(error);

    processing = false;

    replyBox.textContent =
      "MAX connection error.";

    setStatus("Say MAX...");

    wakeMode = true;

    restartAfterListening();
  }
}

function speak(text) {

  return new Promise((resolve) => {

    if (!text) {
      resolve();
      return;
    }

    // STOP microphone BEFORE TTS
    stopRecognition();

    speaking = true;

    setStatus("MAX speaking...");

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang =
      /[\u0900-\u097F]/.test(text)
        ? "hi-IN"
        : "en-IN";

    utterance.rate = 1;
    utterance.pitch = 1;

    utterance.onend = () => {

      speaking = false;

      // Small delay prevents MAX from hearing
      // the last part of its own voice.
      setTimeout(() => {

        resolve();

      }, 500);
    };

    utterance.onerror = () => {

      speaking = false;

      setTimeout(() => {
        resolve();
      }, 500);
    };

    window.speechSynthesis.speak(utterance);
  });
}

startBtn.onclick = () => {

  if (!SpeechRecognition) return;

  maxRunning = true;
  speaking = false;
  processing = false;
  wakeMode = true;

  replyBox.textContent = "";

  setStatus("Say MAX...");

  createRecognition();

  startRecognition();
};

stopBtn.onclick = () => {

  maxRunning = false;

  speaking = false;
  processing = false;
  listening = false;

  stopRecognition();

  window.speechSynthesis.cancel();

  orb.classList.remove("active");

  setStatus("MAX is sleeping");
};

async function sendTypedMessage() {

  const message = input.value.trim();

  if (!message) return;

  input.value = "";

  await sendMessage(message);
}

sendBtn.onclick = sendTypedMessage;

input.addEventListener("keydown", (event) => {

  if (event.key === "Enter") {
    sendTypedMessage();
  }

});

</script>

</body>
</html>
