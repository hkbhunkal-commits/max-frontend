<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 42px;
      letter-spacing: 4px;
    }

    #status {
      margin-top: 10px;
      color: #aaa;
      text-align: center;
      min-height: 24px;
    }

    .orb {
      width: 180px;
      height: 180px;
      margin: 70px 0 35px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        #ffffff 0%,
        #777 35%,
        #111 70%
      );
      box-shadow: 0 0 50px rgba(255,255,255,.25);
      transition: .3s;
    }

    .orb.active {
      box-shadow: 0 0 80px rgba(255,255,255,.6);
      transform: scale(1.05);
    }

    button {
      width: 220px;
      padding: 15px;
      border: none;
      border-radius: 30px;
      margin: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    #startBtn {
      background: white;
      color: black;
    }

    #stopBtn {
      background: #333;
      color: white;
    }

    .chat {
      width: 100%;
      margin-top: 30px;
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      padding: 13px;
      border-radius: 20px;
      border: 1px solid #444;
      background: #17171c;
      color: white;
      outline: none;
    }

    #sendBtn {
      width: 70px;
      margin: 0;
      padding: 10px;
      background: white;
      color: black;
    }

    #reply {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: #15151a;
      border-radius: 15px;
      min-height: 50px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>MAX</h1>

  <div id="status">MAX is sleeping</div>

  <div id="orb" class="orb"></div>

  <button id="startBtn">START MAX</button>
  <button id="stopBtn">STOP MAX</button>

  <div class="chat">
    <input
      id="input"
      type="text"
      placeholder="Type to MAX..."
    >

    <button id="sendBtn">Send</button>
  </div>

  <div id="reply"></div>

</div>


<script>

const BACKEND =
  "https://max-backend-u4r6.onrender.com";


const statusText =
  document.getElementById("status");

const orb =
  document.getElementById("orb");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("sendBtn");

const replyBox =
  document.getElementById("reply");


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let recognition = null;

let maxRunning = false;
let listening = false;
let speaking = false;
let processing = false;

let wakeMode = true;

let lastReply = "";
let lastReplyTime = 0;

let restartTimer = null;


/* =========================
   STATUS
========================= */

function setStatus(text) {
  statusText.textContent = text;
}


/* =========================
   CLEAN SPEECH
========================= */

function cleanSpeech(text) {

  if (!text) return "";

  return text
    .replace(/```[\s\S]*?```/g, "")
    .replace(/[*_#`]/g, "")
    .replace(/[-•]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}


/* =========================
   STOP RECOGNITION
========================= */

function stopRecognition() {

  listening = false;

  if (!recognition) return;

  try {
    recognition.stop();
  } catch (e) {}

  orb.classList.remove("active");
}


/* =========================
   START RECOGNITION
========================= */

function startRecognition() {

  if (!maxRunning) return;

  if (speaking) return;

  if (processing) return;

  if (listening) return;


  if (!recognition) {
    createRecognition();
  }


  try {

    listening = true;

    recognition.start();

  } catch (e) {

    listening = false;

    console.log(
      "Recognition start error:",
      e
    );

    setTimeout(() => {

      if (
        maxRunning &&
        !speaking &&
        !processing &&
        !listening
      ) {
        startRecognition();
      }

    }, 700);
  }
}


/* =========================
   CREATE RECOGNITION
========================= */

function createRecognition() {

  recognition =
    new SpeechRecognition();


  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.lang = "en-IN";


  /* =========================
     ON START
  ========================= */

  recognition.onstart = () => {

    listening = true;

    orb.classList.add("active");


    if (wakeMode) {

      setStatus("Say MAX...");

    } else {

      setStatus(
        "Listening for your command..."
      );
    }
  };


  /* =========================
     ON RESULT
  ========================= */

  recognition.onresult = async (event) => {

    if (!maxRunning) return;

    if (speaking) return;

    if (processing) return;


    const text =
      event.results[
        event.results.length - 1
      ][0]
      .transcript
      .trim();


    listening = false;

    orb.classList.remove("active");


    if (!text) {

      restartListening();

      return;
    }


    console.log(
      "MAX heard:",
      text
    );


    /* =========================
       WAKE WORD MODE
    ========================= */

    if (wakeMode) {

      const lower =
        text.toLowerCase();


      if (
        lower === "max" ||
        lower.includes("max")
      ) {

        /*
          MAX detected.
          Stop recognition first.
        */

        stopRecognition();

        wakeMode = false;


        /*
          Say Haan boss only once.
        */

        await speak(
          "Haan boss."
        );


        /*
          After speaking,
          listen for command.
        */

        if (maxRunning) {

          setTimeout(() => {

            if (
              maxRunning &&
              !speaking &&
              !processing
            ) {

              startCommandListening();

            }

          }, 600);
        }


      } else {

        /*
          MAX wasn't said.
          Keep waiting.
        */

        wakeMode = true;

        restartListening();
      }


      return;
    }


    /* =========================
       COMMAND MODE
    ========================= */

    await sendMessage(text);

  };


  /* =========================
     ON ERROR
  ========================= */

  recognition.onerror = (event) => {

    console.log(
      "Speech error:",
      event.error
    );


    listening = false;

    orb.classList.remove("active");


    if (!maxRunning) return;


    if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {

      setStatus(
        "Microphone permission required."
      );

      return;
    }


    if (
      event.error === "aborted"
    ) {

      /*
        Aborted errors can happen normally
        when we stop recognition before TTS.
      */

      if (
        !speaking &&
        !processing
      ) {

        restartListening();
      }

      return;
    }


    restartListening();
  };


  /* =========================
     ON END
  ========================= */

  recognition.onend = () => {

    listening = false;

    orb.classList.remove("active");


    if (!maxRunning) return;


    /*
      Never restart while MAX is talking
      or processing a request.
    */

    if (speaking) return;

    if (processing) return;


    /*
      If command finished,
      ALWAYS return to wake mode.
    */

    if (!wakeMode) {

      wakeMode = true;
    }


    setStatus("Say MAX...");


    restartListening();
  };
}


/* =========================
   RESTART LISTENING
========================= */

function restartListening() {

  if (!maxRunning) return;

  if (speaking) return;

  if (processing) return;


  clearTimeout(restartTimer);


  restartTimer =
    setTimeout(() => {

      if (!maxRunning) return;

      if (speaking) return;

      if (processing) return;

      if (listening) return;


      startRecognition();

    }, 800);
}


/* =========================
   COMMAND LISTENING
========================= */

function startCommandListening() {

  if (!maxRunning) return;

  if (speaking) return;

  if (processing) return;


  wakeMode = false;


  setStatus(
    "Listening for your command..."
  );


  clearTimeout(restartTimer);


  restartTimer =
    setTimeout(() => {

      if (
        maxRunning &&
        !speaking &&
        !processing &&
        !listening
      ) {

        startRecognition();
      }

    }, 300);
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(message) {

  if (!message) return;

  if (processing) return;

  if (speaking) return;


  processing = true;


  stopRecognition();


  setStatus("Thinking...");


  try {

    const response =
      await fetch(
        `${BACKEND}/chat`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Server error"
      );
    }


    let reply =
      cleanSpeech(data.reply);


    if (!reply) {

      reply =
        "Sorry boss, mujhe samajh nahi aaya.";
    }


    /* =========================
       DUPLICATE PROTECTION
    ========================= */

    const now =
      Date.now();


    if (
      reply === lastReply &&
      now - lastReplyTime < 5000
    ) {

      processing = false;

      wakeMode = true;

      setStatus("Say MAX...");

      restartListening();

      return;
    }


    lastReply = reply;

    lastReplyTime = now;


    replyBox.textContent =
      reply;


    /*
      Processing finished BEFORE TTS.
    */

    processing = false;


    /*
      MAX speaks once.
    */

    await speak(reply);


    /*
      IMPORTANT:
      After every answer,
      go back to wake-word mode.
    */

    wakeMode = true;


    if (maxRunning) {

      setStatus(
        "Say MAX..."
      );


      setTimeout(() => {

        if (
          maxRunning &&
          !speaking &&
          !processing &&
          !listening
        ) {

          startRecognition();
        }

      }, 900);
    }


  } catch (error) {

    console.error(
      "MAX error:",
      error
    );


    processing = false;

    wakeMode = true;


    replyBox.textContent =
      "MAX connection error.";


    setStatus(
      "Say MAX..."
    );


    restartListening();
  }
}


/* =========================
   TEXT TO SPEECH
========================= */

function speak(text) {

  return new Promise((resolve) => {

    if (!text) {

      resolve();

      return;
    }


    /*
      STOP MICROPHONE
      BEFORE MAX SPEAKS.
    */

    stopRecognition();


    speaking = true;


    setStatus(
      "MAX speaking..."
    );


    window.speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    /*
      Better language selection.
    */

    if (
      /[\u0900-\u097F]/.test(text)
    ) {

      utterance.lang =
        "hi-IN";

    } else {

      utterance.lang =
        "en-IN";
    }


    utterance.rate = 1;

    utterance.pitch = 1;


    let finished = false;


    function finishSpeaking() {

      if (finished) return;

      finished = true;

      speaking = false;


      /*
        Small safety delay so MAX
        doesn't hear its own final words.
      */

      setTimeout(() => {

        resolve();

      }, 500);
    }


    utterance.onend =
      finishSpeaking;


    utterance.onerror =
      finishSpeaking;


    window.speechSynthesis.speak(
      utterance
    );

  });
}


/* =========================
   START MAX
========================= */

startBtn.onclick = () => {

  if (!SpeechRecognition) {

    setStatus(
      "Voice recognition is not supported in this browser."
    );

    return;
  }


  /*
    Clear any old state.
  */

  clearTimeout(restartTimer);


  maxRunning = true;

  speaking = false;

  processing = false;

  listening = false;

  wakeMode = true;


  replyBox.textContent = "";


  setStatus(
    "Say MAX..."
  );


  /*
    Create fresh recognition.
  */

  if (recognition) {

    try {
      recognition.abort();
    } catch (e) {}

  }


  recognition = null;


  createRecognition();

  startRecognition();
};


/* =========================
   STOP MAX
========================= */

stopBtn.onclick = () => {

  maxRunning = false;

  speaking = false;

  processing = false;

  listening = false;

  wakeMode = true;


  clearTimeout(
    restartTimer
  );


  stopRecognition();


  window.speechSynthesis.cancel();


  orb.classList.remove(
    "active"
  );


  setStatus(
    "MAX is sleeping"
  );
};


/* =========================
   TYPED MESSAGE
========================= */

async function sendTypedMessage() {

  const message =
    input.value.trim();


  if (!message) return;


  input.value = "";


  await sendMessage(
    message
  );
}


sendBtn.onclick =
  sendTypedMessage;


input.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Enter"
    ) {

      sendTypedMessage();
    }

  }
);


/* =========================
   BROWSER CHECK
========================= */

if (!SpeechRecognition) {

  setStatus(
    "Voice recognition is not supported in this browser."
  );
}

</script>

</body>
</html>
