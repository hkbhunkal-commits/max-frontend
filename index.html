<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAX AI Assistant</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #0f172a;
    color: white;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.box {
    width: 100%;
    max-width: 650px;

    background: #1e293b;

    border-radius: 24px;

    padding: 30px 20px;

    text-align: center;
}

h1 {
    margin: 0;
    font-size: 34px;
}

.subtitle {
    color: #94a3b8;
    margin-top: 8px;
}

#orb {

    width: 150px;
    height: 150px;

    margin: 30px auto 20px;

    border-radius: 50%;

    background: #334155;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 55px;

    transition: 0.25s;
}

#orb.listening {
    background: #2563eb;
    transform: scale(1.08);
}

#orb.thinking {
    background: #7c3aed;
    transform: scale(1.05);
}

#orb.speaking {
    background: #16a34a;
    transform: scale(1.08);
}

button {

    border: none;

    border-radius: 14px;

    padding: 15px 25px;

    margin: 8px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

#stopBtn {
    display: none;
}

#status {

    min-height: 24px;

    color: #cbd5e1;

    margin: 15px 0;
}

#response {

    margin-top: 25px;

    padding: 18px;

    border-radius: 15px;

    background: #0f172a;

    text-align: left;

    line-height: 1.6;

    white-space: pre-wrap;
}

</style>
</head>


<body>

<div class="box">

    <h1>MAX 🤖</h1>

    <div class="subtitle">
        Your AI Assistant
    </div>

    <div id="orb">
        🤖
    </div>

    <div id="status">
        Press START MAX
    </div>

    <button id="startBtn">
        🎤 START MAX
    </button>

    <button id="stopBtn">
        🛑 STOP
    </button>

    <div id="response"></div>

</div>


<script>


// ==========================================
// BACKEND
// ==========================================

const BACKEND =
"https://max-backend-u4r6.onrender.com/chat";


// ==========================================
// ELEMENTS
// ==========================================

const orb =
document.getElementById("orb");

const statusBox =
document.getElementById("status");

const responseBox =
document.getElementById("response");

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");


// ==========================================
// VARIABLES
// ==========================================

let recognition = null;

let maxActive = false;

let listening = false;

let speaking = false;

let thinking = false;

let commandMode = false;


// ==========================================
// SPEECH RECOGNITION
// ==========================================

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    statusBox.textContent =
    "Voice recognition is not supported. Please use Chrome.";

} else {

    recognition =
    new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang = "en-IN";


    // ======================================
    // WHEN MICROPHONE STARTS
    // ======================================

    recognition.onstart = function() {

        listening = true;

        orb.className = "listening";

        if (commandMode) {

            statusBox.textContent =
            "I'm listening... 🎤";

        } else {

            statusBox.textContent =
            'Say "MAX"... 🎤';

        }

    };


    // ======================================
    // WHEN SPEECH IS DETECTED
    // ======================================

    recognition.onresult = function(event) {

        listening = false;

        orb.className = "";


        const heard =
        event.results[0][0].transcript.trim();


        console.log("MAX heard:", heard);


        // ==================================
        // COMMAND MODE
        // ==================================

        if (commandMode) {

            commandMode = false;

            sendMessage(heard);

            return;
        }


        // ==================================
        // WAKE WORD MODE
        // ==================================

        const command =
        removeWakeWord(heard);


        // User only said MAX
        if (command === "") {

            commandMode = true;

            speakWakeWord();

            return;
        }


        // User said:
        // MAX how are you?

        commandMode = false;

        sendMessage(command);

    };


    // ======================================
    // RECOGNITION ERROR
    // ======================================

    recognition.onerror = function(event) {

        listening = false;

        orb.className = "";

        console.log(
            "Recognition error:",
            event.error
        );


        if (event.error === "not-allowed") {

            statusBox.textContent =
            "Microphone permission denied.";

            maxActive = false;

            return;
        }


        if (
            maxActive &&
            !speaking &&
            !thinking
        ) {

            restartListening();

        }

    };


    // ======================================
    // RECOGNITION ENDED
    // ======================================

    recognition.onend = function() {

        listening = false;

        orb.className = "";


        console.log(
            "Recognition ended."
        );


        /*
        IMPORTANT:

        If MAX is active and is not speaking
        or thinking, start microphone again.
        */


        if (
            maxActive &&
            !speaking &&
            !thinking
        ) {

            restartListening();

        }

    };

}


// ==========================================
// START MAX
// ==========================================

startBtn.onclick = function() {

    startMAX();

};


// ==========================================
// STOP MAX
// ==========================================

stopBtn.onclick = function() {

    stopMAX();

};


// ==========================================
// START FUNCTION
// ==========================================

function startMAX() {

    if (!recognition) {

        return;

    }


    maxActive = true;

    commandMode = false;

    speaking = false;

    thinking = false;


    startBtn.style.display =
    "none";

    stopBtn.style.display =
    "inline-block";


    statusBox.textContent =
    'Say "MAX"... 🎤';


    restartListening();

}


// ==========================================
// STOP FUNCTION
// ==========================================

function stopMAX() {

    maxActive = false;

    commandMode = false;

    listening = false;

    speaking = false;

    thinking = false;


    try {

        recognition.stop();

    } catch(e) {}


    speechSynthesis.cancel();


    orb.className = "";


    startBtn.style.display =
    "inline-block";

    stopBtn.style.display =
    "none";


    statusBox.textContent =
    "MAX stopped.";

}


// ==========================================
// START MICROPHONE
// ==========================================

function restartListening() {

    if (
        !maxActive ||
        listening ||
        speaking ||
        thinking
    ) {

        return;

    }


    setTimeout(function() {

        if (
            !maxActive ||
            listening ||
            speaking ||
            thinking
        ) {

            return;

        }


        try {

            recognition.start();

        } catch(error) {

            console.log(
                "Recognition restart:",
                error
            );

        }

    }, 500);

}


// ==========================================
// REMOVE WAKE WORD
// ==========================================

function removeWakeWord(text) {

    let clean =
    text
    .toLowerCase()
    .trim();


    clean =
    clean.replace(
        /^[,.\s]*(hey|okay|ok)?\s*max[\s,.\-:]*/i,
        ""
    );


    return clean.trim();

}


// ==========================================
// SAY "HAAN BOSS"
// ==========================================

function speakWakeWord() {

    speaking = true;

    orb.className =
    "speaking";


    statusBox.textContent =
    "MAX is responding...";


    speechSynthesis.cancel();


    const voice =
    new SpeechSynthesisUtterance(
        "Haan boss."
    );


    voice.lang =
    "hi-IN";

    voice.rate =
    0.95;

    voice.pitch =
    1;


    voice.onend = function() {

        speaking = false;


        /*
        VERY IMPORTANT:

        MAX has heard the wake word.

        Now directly enter COMMAND MODE.
        */

        commandMode = true;


        orb.className =
        "listening";


        statusBox.textContent =
        "I'm listening... 🎤";


        restartListening();

    };


    voice.onerror = function() {

        speaking = false;

        commandMode = true;


        orb.className =
        "listening";


        statusBox.textContent =
        "I'm listening... 🎤";


        restartListening();

    };


    speechSynthesis.speak(
        voice
    );

}


// ==========================================
// SEND MESSAGE TO AI
// ==========================================

async function sendMessage(message) {

    if (!message) {

        commandMode = false;

        statusBox.textContent =
        'Say "MAX"... 🎤';

        restartListening();

        return;

    }


    thinking = true;

    speaking = false;


    orb.className =
    "thinking";


    statusBox.textContent =
    "Thinking... 🧠";


    responseBox.innerHTML =
    "<b>You:</b> " +
    escapeHtml(message) +
    "<br><br>" +
    "<b>MAX:</b> Thinking...";


    try {


        const response =
        await fetch(

            BACKEND,

            {

                method: "POST",

                headers: {

                    "Content-Type":
                    "application/json"

                },

                body: JSON.stringify({

                    message: message

                })

            }

        );


        const data =
        await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "MAX server error"
            );

        }


        const reply =
        data.reply || "";


        thinking = false;


        responseBox.innerHTML =

        "<b>You:</b> " +
        escapeHtml(message) +

        "<br><br>" +

        "<b>MAX:</b> " +
        escapeHtml(reply);


        speakReply(reply);


    } catch(error) {

        thinking = false;

        orb.className = "";


        responseBox.innerHTML =
        "<b>Error:</b> " +
        escapeHtml(
            error.message
        );


        statusBox.textContent =
        "Something went wrong.";


        if (maxActive) {

            commandMode = false;

            restartListening();

        }

    }

}


// ==========================================
// SPEAK AI REPLY
// ==========================================

function speakReply(text) {

    if (!text) {

        speaking = false;

        thinking = false;

        commandMode = false;

        statusBox.textContent =
        'Say "MAX"... 🎤';

        restartListening();

        return;

    }


    speechSynthesis.cancel();


    const clean =
    cleanForSpeech(text);


    const voice =
    new SpeechSynthesisUtterance(
        clean
    );


    speaking = true;

    thinking = false;


    // Hindi voice
    if (
        /[\u0900-\u097F]/.test(text)
    ) {

        voice.lang =
        "hi-IN";

    }

    // English / Hinglish
    else {

        voice.lang =
        "en-IN";

    }


    voice.rate =
    0.95;

    voice.pitch =
    1;

    voice.volume =
    1;


    voice.onstart =
    function() {

        orb.className =
        "speaking";

        statusBox.textContent =
        "MAX is speaking... 🔊";

    };


    voice.onend =
    function() {

        speaking = false;

        thinking = false;

        commandMode = false;


        orb.className = "";


        /*
        IMPORTANT:

        After MAX finishes answering,
        it goes back to WAKE WORD MODE.

        User must say MAX again.
        */


        if (maxActive) {

            statusBox.textContent =
            'Say "MAX"... 🎤';

            restartListening();

        }

    };


    voice.onerror =
    function() {

        speaking = false;

        thinking = false;

        commandMode = false;


        orb.className = "";


        if (maxActive) {

            statusBox.textContent =
            'Say "MAX"... 🎤';

            restartListening();

        }

    };


    speechSynthesis.speak(
        voice
    );

}


// ==========================================
// CLEAN TEXT BEFORE SPEAKING
// ==========================================

function cleanForSpeech(text) {

    return text

        .replace(
            /```[\s\S]*?```/g,
            ""
        )

        .replace(
            /\*\*/g,
            ""
        )

        .replace(
            /\*/g,
            ""
        )

        .replace(
            /__/g,
            ""
        )

        .replace(
            /_/g,
            ""
        )

        .replace(
            /`/g,
            ""
        )

        .replace(
            /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


// ==========================================
// HTML SECURITY
// ==========================================

function escapeHtml(text) {

    const div =
    document.createElement("div");


    div.textContent =
    text;


    return div.innerHTML;

}

</script>

</body>
  </html>
