<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAX AI Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 650px;
  background: #1e293b;
  border-radius: 24px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 15px 50px rgba(0,0,0,0.35);
}

h1 {
  margin: 0;
  font-size: 32px;
}

.subtitle {
  color: #94a3b8;
  margin-top: 8px;
}

#orb {
  width: 150px;
  height: 150px;
  margin: 30px auto 20px;
  border-radius: 50%;
  background: #334155;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  transition: 0.25s;
}

#orb.listening {
  transform: scale(1.08);
  background: #2563eb;
}

#orb.thinking {
  transform: scale(1.05);
  background: #7c3aed;
}

#orb.speaking {
  transform: scale(1.08);
  background: #16a34a;
}

#status {
  min-height: 24px;
  color: #cbd5e1;
  margin: 15px 0;
}

button {
  border: none;
  border-radius: 14px;
  padding: 15px 25px;
  margin: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#startBtn {
  font-size: 19px;
}

#stopBtn {
  display: none;
}

#response {
  margin-top: 25px;
  padding: 18px;
  border-radius: 15px;
  background: #0f172a;
  text-align: left;
  line-height: 1.6;
  white-space: pre-wrap;
  min-height: 50px;
}

.small {
  margin-top: 18px;
  color: #64748b;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="box">

  <h1>MAX 🤖</h1>

  <div class="subtitle">
    Your AI Assistant
  </div>

  <div id="orb">🤖</div>

  <div id="status">
    Press START MAX
  </div>

  <button id="startBtn">
    🎤 START MAX
  </button>

  <button id="stopBtn">
    🛑 STOP
  </button>

  <div id="response"></div>

  <div class="small">
    Say "MAX" to wake your assistant
  </div>

</div>


<script>

const BACKEND =
"https://max-backend-u4r6.onrender.com/chat";


const orb =
document.getElementById("orb");

const statusBox =
document.getElementById("status");

const responseBox =
document.getElementById("response");

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");


let recognition = null;

let maxActive = false;

let listening = false;

let speaking = false;

let thinking = false;


// ==========================================
// SPEECH RECOGNITION
// ==========================================

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  statusBox.textContent =
  "Voice recognition is not supported. Please use Chrome.";

} else {

  recognition =
  new SpeechRecognition();

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.lang = "en-IN";


  // ========================================
  // RECOGNITION START
  // ========================================

  recognition.onstart = function() {

    listening = true;

    orb.classList.add("listening");

  };


  // ========================================
  // RECOGNITION RESULT
  // ========================================

  recognition.onresult =
  async function(event) {

    listening = false;

    orb.classList.remove("listening");


    const heard =
    event.results[0][0].transcript.trim();


    console.log("MAX heard:", heard);


    // --------------------------------------
    // WAKE WORD
    // --------------------------------------

    if (!waitingForCommand) {

      const command =
      removeWakeWord(heard);


      // "MAX" alone
      if (!command) {

        speak(
          "Haan boss."
        );

        waitingForCommand = true;

        return;

      }


      // "MAX, how are you?"
      if (command) {

        waitingForCommand = false;

        await sendMessage(command);

        return;

      }

    }


    // --------------------------------------
    // COMMAND AFTER "HAAN BOSS"
    // --------------------------------------

    if (waitingForCommand) {

      waitingForCommand = false;

      await sendMessage(heard);

    }

  };


  // ========================================
  // ERROR
  // ========================================

  recognition.onerror =
  function(event) {

    listening = false;

    orb.classList.remove("listening");


    console.log(
      "Recognition error:",
      event.error
    );


    if (event.error === "not-allowed") {

      statusBox.textContent =
      "Microphone permission denied.";

      maxActive = false;

      return;

    }


    if (maxActive && !speaking) {

      setTimeout(
        listen,
        800
      );

    }

  };


  // ========================================
  // END
  // ========================================

  recognition.onend =
  function() {

    listening = false;

    orb.classList.remove("listening");


    if (
      maxActive &&
      !speaking &&
      !thinking
    ) {

      setTimeout(
        listen,
        500
      );

    }

  };

}


// ==========================================
// STATE
// ==========================================

let waitingForCommand = false;


// ==========================================
// START MAX
// ==========================================

startBtn.onclick =
function() {

  startMAX();

};


stopBtn.onclick =
function() {

  stopMAX();

};


function startMAX() {

  if (!recognition) {
    return;
  }


  maxActive = true;

  waitingForCommand = false;


  startBtn.style.display =
  "none";

  stopBtn.style.display =
  "inline-block";


  statusBox.textContent =
  'Say "MAX"... 🎤';


  listen();

}


// ==========================================
// STOP MAX
// ==========================================

function stopMAX() {

  maxActive = false;

  waitingForCommand = false;

  listening = false;

  thinking = false;

  speaking = false;


  try {
    recognition.stop();
  } catch(e) {}


  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }


  orb.className = "";


  startBtn.style.display =
  "inline-block";

  stopBtn.style.display =
  "none";


  statusBox.textContent =
  "MAX stopped.";

}


// ==========================================
// LISTEN
// ==========================================

function listen() {

  if (
    !maxActive ||
    listening ||
    speaking ||
    thinking
  ) {
    return;
  }


  try {

    recognition.start();

  } catch(e) {

    console.log(
      "Already listening"
    );

  }

}


// ==========================================
// REMOVE WAKE WORD
// ==========================================

function removeWakeWord(text) {

  let clean =
  text
  .toLowerCase()
  .trim();


  clean =
  clean.replace(
    /^[,.\s]*(hey|okay|ok)?\s*max[\s,.\-:]*/i,
    ""
  );


  return clean.trim();

}


// ==========================================
// SEND MESSAGE TO BACKEND
// ==========================================

async function sendMessage(message) {

  if (!message) {

    waitingForCommand = false;

    listen();

    return;

  }


  thinking = true;

  speaking = false;


  orb.className =
  "thinking";


  statusBox.textContent =
  "Thinking... 🧠";


  responseBox.innerHTML =
  "<b>You:</b> " +
  escapeHtml(message) +
  "<br><br>" +
  "<b>MAX:</b> Thinking...";


  try {

    const response =
    await fetch(
      BACKEND,
      {
        method: "POST",

        headers: {
          "Content-Type":
          "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      }
    );


    const data =
    await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "MAX server error"
      );

    }


    const reply =
    data.reply || "";


    thinking = false;


    responseBox.innerHTML =
    "<b>You:</b> " +
    escapeHtml(message) +
    "<br><br>" +
    "<b>MAX:</b> " +
    escapeHtml(reply);


    speak(reply);


  } catch(error) {

    thinking = false;

    orb.className = "";


    responseBox.innerHTML =
    "<b>Error:</b> " +
    escapeHtml(error.message);


    statusBox.textContent =
    "Something went wrong.";


    if (maxActive) {

      setTimeout(
        listen,
        1000
      );

    }

  }

}


// ==========================================
// SPEAK
// ==========================================

function speak(text) {

  if (
    !text ||
    !("speechSynthesis" in window)
  ) {

    speaking = false;

    orb.className = "";

    listen();

    return;

  }


  speechSynthesis.cancel();


  const clean =
  cleanForSpeech(text);


  const utterance =
  new SpeechSynthesisUtterance(
    clean
  );


  // ========================================
  // LANGUAGE
  // ========================================

  if (
    /[\u0900-\u097F]/.test(text)
  ) {

    utterance.lang =
    "hi-IN";

  } else {

    utterance.lang =
    "en-IN";

  }


  utterance.rate =
  0.95;

  utterance.pitch =
  1;

  utterance.volume =
  1;


  utterance.onstart =
  function() {

    speaking = true;

    thinking = false;


    orb.className =
    "speaking";


    statusBox.textContent =
    "MAX is speaking... 🔊";

  };


  utterance.onend =
  function() {

    speaking = false;

    orb.className = "";


    if (maxActive) {

      waitingForCommand = false;


      statusBox.textContent =
      'Say "MAX"... 🎤';


      setTimeout(
        listen,
        500
      );

    }

  };


  utterance.onerror =
  function() {

    speaking = false;

    orb.className = "";


    speechSynthesis.cancel();


    if (maxActive) {

      statusBox.textContent =
      'Say "MAX"... 🎤';


      setTimeout(
        listen,
        500
      );

    }

  };


  speechSynthesis.speak(
    utterance
  );

}


// ==========================================
// CLEAN AI TEXT BEFORE SPEAKING
// ==========================================

function cleanForSpeech(text) {

  return text

    .replace(
      /```[\s\S]*?```/g,
      ""
    )

    .replace(
      /\*\*/g,
      ""
    )

    .replace(
      /\*/g,
      ""
    )

    .replace(
      /__/g,
      ""
    )

    .replace(
      /_/g,
      ""
    )

    .replace(
      /`/g,
      ""
    )

    .replace(
      /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,
      ""
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(text) {

  const div =
  document.createElement("div");

  div.textContent =
  text;

  return div.innerHTML;

}

</script>

</body>
</html>
