<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAX AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:500px;
  padding:25px;
  text-align:center;
}

h1{
  font-size:55px;
  margin:10px 0;
  letter-spacing:5px;
}

.status{
  color:#aaa;
  min-height:24px;
}

.orb{
  width:170px;
  height:170px;
  margin:30px auto;
  border-radius:50%;
  background:radial-gradient(circle,#444,#111 65%,#000);
  box-shadow:0 0 40px #222;
  transition:.2s;
}

.orb.active{
  box-shadow:0 0 65px #888;
  transform:scale(1.05);
}

button{
  border:0;
  border-radius:30px;
  padding:14px 28px;
  font-size:17px;
  margin:8px;
  cursor:pointer;
}

input{
  width:90%;
  padding:14px;
  border-radius:25px;
  border:1px solid #444;
  background:#151515;
  color:white;
  font-size:16px;
  outline:none;
}

.reply{
  margin-top:25px;
  min-height:50px;
  font-size:18px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="app">

<h1>MAX</h1>

<div id="status" class="status">
Press START MAX
</div>

<div id="orb" class="orb"></div>

<button id="startBtn">
START MAX
</button>

<div>
<input id="textInput" placeholder="Type something...">
<button id="sendBtn">
SEND
</button>
</div>

<div id="reply" class="reply"></div>

</div>

<script>

const BACKEND =
"https://max-backend-u4r6.onrender.com";

let recognition = null;

let maxRunning = false;
let conversationMode = false;

let listening = false;
let speaking = false;
let processing = false;

let restartTimer = null;
let silenceTimer = null;

/* BARGE-IN */
let bargeRecognition = null;
let bargeListening = false;
let currentSpeechText = "";


/* =========================
   UI
========================= */

function status(text){
  document
    .getElementById("status")
    .textContent = text;
}

function orb(on){
  document
    .getElementById("orb")
    .classList.toggle("active",on);
}


/* =========================
   CLEAN SPEECH
========================= */

function cleanSpeech(text){

  if(!text) return "";

  let t = text;

  t = t.replace(/[*_#`~]/g," ");

  t = t.replace(/[()[\]{}]/g," ");

  t = t.replace(/[.,!?;:]/g," ");

  t = t.replace(/[\/\\|<>+=@#$%^&]/g," ");

  t = t.replace(/\s+/g," ").trim();

  return t;
}


/* =========================
   STOP NORMAL RECOGNITION
========================= */

function stopRecognition(){

  if(!recognition) return;

  try{
    recognition.abort();
  }catch(e){}

  listening=false;
}


/* =========================
   STOP BARGE LISTENER
========================= */

function stopBargeRecognition(){

  if(!bargeRecognition) return;

  try{
    bargeRecognition.abort();
  }catch(e){}

  bargeListening=false;
}


/* =========================
   STOP MAX SPEAKING
========================= */

function stopMAXSpeech(){

  try{
    window.speechSynthesis.cancel();
  }catch(e){}

  speaking=false;
  currentSpeechText="";

  stopBargeRecognition();

  orb(false);
}


/* =========================
   BARGE-IN RECOGNITION
========================= */

function createBargeRecognition(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR) return null;

  const r = new SR();

  r.continuous=false;
  r.interimResults=false;
  r.lang="en-IN";


  r.onstart=function(){

    bargeListening=true;

  };


  r.onresult=async function(event){

    bargeListening=false;

    const text =
      event.results[
        event.results.length-1
      ][0].transcript.trim();


    if(
      !text ||
      !maxRunning ||
      !speaking
    ){

      return;

    }


    /*
      Ignore MAX's own voice if
      recognition catches a large
      part of the sentence.
    */

    const spoken =
      currentSpeechText
        .toLowerCase()
        .replace(/[^\w\s]/g,"")
        .trim();


    const heard =
      text
        .toLowerCase()
        .replace(/[^\w\s]/g,"")
        .trim();


    if(
      spoken &&
      (
        spoken === heard ||
        spoken.includes(heard) ||
        heard.includes(spoken)
      )
    ){

      if(speaking)
        startBargeRecognition();

      return;

    }


    /*
      USER INTERRUPTED MAX
    */

    stopMAXSpeech();

    conversationMode=true;

    await askMAX(text);

  };


  r.onerror=function(){

    bargeListening=false;

    if(
      maxRunning &&
      speaking
    ){

      startBargeRecognition();

    }

  };


  r.onend=function(){

    bargeListening=false;

    if(
      maxRunning &&
      speaking
    ){

      startBargeRecognition();

    }

  };


  return r;
}


/* =========================
   START BARGE LISTENING
========================= */

function startBargeRecognition(){

  if(!maxRunning)
    return;

  if(!speaking)
    return;

  if(bargeListening)
    return;


  if(!bargeRecognition){

    bargeRecognition =
      createBargeRecognition();

  }


  if(!bargeRecognition)
    return;


  try{

    bargeRecognition.start();

  }catch(e){}

}


/* =========================
   SPEAK
========================= */

function speak(text){

  if(!maxRunning)
    return;


  const clean =
    cleanSpeech(text);


  if(!clean){

    speaking=false;
    currentSpeechText="";

    if(
      maxRunning &&
      conversationMode
    ){

      startListening();

    }

    return;

  }


  stopRecognition();
  stopBargeRecognition();

  clearTimeout(restartTimer);
  clearTimeout(silenceTimer);


  speaking=true;
  currentSpeechText=clean;


  orb(true);

  status("MAX बोल रहा है...");


  window.speechSynthesis.cancel();


  const u =
    new SpeechSynthesisUtterance(clean);


  const hindi =
    /[\u0900-\u097F]|hai|haan|boss|bro|kaise|kya|mujhe|aap|mera|meri|nahi|nahin|bata|bta|acha|achha|kr|kar|hoga|chahiye/i;


  if(hindi.test(clean)){

    u.lang="hi-IN";

  }else{

    u.lang="en-IN";

  }


  u.rate=.9;
  u.pitch=1;


  const voices =
    window.speechSynthesis.getVoices();


  let voice=null;


  if(u.lang==="hi-IN"){

    voice =
      voices.find(
        v=>v.lang==="hi-IN"
      ) ||
      voices.find(
        v=>v.lang.startsWith("hi")
      );

  }else{

    voice =
      voices.find(
        v=>v.lang==="en-IN"
      ) ||
      voices.find(
        v=>v.lang.startsWith("en-IN")
      ) ||
      voices.find(
        v=>v.lang.startsWith("en")
      );

  }


  if(voice)
    u.voice=voice;


  /*
    Start barge-in listener
    shortly after MAX starts talking.
  */

  u.onstart=function(){

    setTimeout(()=>{

      if(
        maxRunning &&
        speaking
      ){

        startBargeRecognition();

      }

    },250);

  };


  u.onend=function(){

    speaking=false;
    currentSpeechText="";

    stopBargeRecognition();

    orb(false);


    if(
      maxRunning &&
      conversationMode
    ){

      status("Listening...");

      startListening();

    }

  };


  u.onerror=function(){

    speaking=false;
    currentSpeechText="";

    stopBargeRecognition();

    orb(false);


    if(
      maxRunning &&
      conversationMode
    ){

      startListening();

    }

  };


  window.speechSynthesis.speak(u);

}


/* =========================
   CREATE SPEECH RECOGNITION
========================= */

function createRecognition(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SR){

    status(
      "Chrome speech recognition required."
    );

    return;

  }


  recognition=new SR();


  recognition.continuous=false;

  recognition.interimResults=false;

  recognition.lang="en-IN";


  recognition.onstart=function(){

    listening=true;

    orb(true);


    if(conversationMode){

      status("Listening...");

    }else{

      status("Say MAX...");

    }


    startSilenceTimer();

  };


  recognition.onresult=async function(event){

    clearTimeout(silenceTimer);

    listening=false;


    const text =
      event.results[
        event.results.length-1
      ][0].transcript.trim();


    if(!text){

      startListening();

      return;

    }


    console.log(
      "MAX heard:",
      text
    );


    await processVoice(text);

  };


  recognition.onerror=function(event){

    console.log(
      "Recognition:",
      event.error
    );


    listening=false;

    clearTimeout(silenceTimer);


    if(
      maxRunning &&
      !speaking &&
      !processing
    ){

      startListening();

    }

  };


  recognition.onend=function(){

    listening=false;

    clearTimeout(silenceTimer);


    if(!maxRunning)
      return;


    if(speaking)
      return;


    if(processing)
      return;


    startListening();

  };

}


/* =========================
   START LISTENING
========================= */

function startListening(){

  if(!maxRunning)
    return;

  if(speaking)
    return;

  if(processing)
    return;

  if(listening)
    return;


  if(!recognition)
    createRecognition();


  if(!recognition)
    return;


  clearTimeout(restartTimer);


  restartTimer =
    setTimeout(()=>{

      if(
        !maxRunning ||
        speaking ||
        processing ||
        listening
      ){

        return;

      }


      try{

        recognition.start();

      }catch(e){}

    },350);

}


/* =========================
   SILENCE
========================= */

function startSilenceTimer(){

  clearTimeout(silenceTimer);


  silenceTimer =
    setTimeout(()=>{

      if(!maxRunning)
        return;


      if(
        speaking ||
        processing
      ){

        return;

      }


      conversationMode=false;

      status("Say MAX...");

    },12000);

}


/* =========================
   VOICE PROCESSING
========================= */

async function processVoice(text){

  clearTimeout(silenceTimer);

  orb(false);


  if(!conversationMode){

    const lower =
      text.toLowerCase();


    const wake =
      /\b(?:hey\s+|hello\s+)?max\b/i
        .test(lower);


    if(!wake){

      startListening();

      return;

    }


    conversationMode=true;

    speak("Haan boss.");

    return;

  }


  await askMAX(text);

}


/* =========================
   ASK MAX
========================= */

async function askMAX(message){

  if(!message)
    return;


  processing=true;


  stopRecognition();
  stopBargeRecognition();


  clearTimeout(restartTimer);
  clearTimeout(silenceTimer);


  orb(true);

  status("Thinking...");


  try{

    const response =
      await fetch(
        BACKEND + "/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:message,

            userId:"default-user"

          })

        }

      );


    if(!response.ok){

      throw new Error(
        "Backend error"
      );

    }


    const data =
      await response.json();


    const answer =
      data.reply ||
      "Sorry boss, answer nahi mila.";


    document
      .getElementById("reply")
      .textContent=answer;


    processing=false;

    conversationMode=true;


    if(maxRunning){

      speak(answer);

    }else{

      orb(false);

      status("Ready.");

    }


  }catch(error){

    console.error(
      "MAX error:",
      error
    );


    processing=false;

    conversationMode=true;


    const errorText =
      "Boss, backend se connection nahi ho raha.";


    document
      .getElementById("reply")
      .textContent=errorText;


    if(maxRunning){

      speak(errorText);

    }else{

      orb(false);

      status("Ready.");

    }

  }

}


/* =========================
   START / STOP
========================= */

document
.getElementById("startBtn")
.addEventListener(
  "click",
  function(){

    if(maxRunning){

      maxRunning=false;

      conversationMode=false;


      clearTimeout(restartTimer);

      clearTimeout(silenceTimer);


      stopRecognition();

      stopBargeRecognition();


      window.speechSynthesis.cancel();


      speaking=false;

      processing=false;

      currentSpeechText="";


      orb(false);


      status(
        "MAX stopped."
      );


      this.textContent =
        "START MAX";


      return;

    }


    maxRunning=true;

    conversationMode=false;


    this.textContent =
      "STOP MAX";


    status(
      "Say MAX..."
    );


    createRecognition();

    startListening();

  }
);


/* =========================
   TEXT INPUT
========================= */

document
.getElementById("sendBtn")
.addEventListener(
  "click",
  function(){

    const input =
      document.getElementById(
        "textInput"
      );


    const text =
      input.value.trim();


    if(!text)
      return;


    input.value="";


    conversationMode=true;


    askMAX(text);

  }
);


/* =========================
   ENTER KEY
========================= */

document
.getElementById("textInput")
.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      document
        .getElementById("sendBtn")
        .click();

    }

  }
);


window.speechSynthesis.onvoiceschanged =
function(){

  window.speechSynthesis.getVoices();

};

</script>

</body>
  </html>
