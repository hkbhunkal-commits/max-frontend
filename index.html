<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 650px;
  background: #1e293b;
  border-radius: 24px;
  padding: 30px 20px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 32px;
}

.subtitle {
  color: #94a3b8;
  margin-top: 8px;
}

#orb {
  width: 150px;
  height: 150px;
  margin: 30px auto 20px;
  border-radius: 50%;
  background: #334155;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  transition: .25s;
}

#orb.listening {
  background: #2563eb;
  transform: scale(1.08);
}

#orb.thinking {
  background: #7c3aed;
  transform: scale(1.05);
}

#orb.speaking {
  background: #16a34a;
  transform: scale(1.08);
}

button {
  border: 0;
  border-radius: 14px;
  padding: 15px 25px;
  margin: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#stopBtn {
  display: none;
}

#status {
  min-height: 24px;
  color: #cbd5e1;
  margin: 15px 0;
}

#response {
  margin-top: 25px;
  padding: 18px;
  border-radius: 15px;
  background: #0f172a;
  text-align: left;
  line-height: 1.6;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="box">

<h1>MAX 🤖</h1>

<div class="subtitle">
Your AI Assistant
</div>

<div id="orb">🤖</div>

<div id="status">
Press START MAX
</div>

<button id="startBtn">
🎤 START MAX
</button>

<button id="stopBtn">
🛑 STOP
</button>

<div id="response"></div>

</div>


<script>

const BACKEND =
"https://max-backend-u4r6.onrender.com/chat";


const orb =
document.getElementById("orb");

const statusBox =
document.getElementById("status");

const responseBox =
document.getElementById("response");

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");


let recognition = null;

let maxActive = false;

let listening = false;

let speaking = false;

let thinking = false;

let waitingForCommand = false;


// =====================================
// SPEECH RECOGNITION
// =====================================

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  statusBox.textContent =
  "Voice recognition is not supported. Use Chrome.";

} else {

  recognition =
  new SpeechRecognition();

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.lang = "en-IN";


  recognition.onstart = function() {

    listening = true;

    orb.classList.add("listening");

    if (waitingForCommand) {

      statusBox.textContent =
      "I'm listening... 🎤";

    } else {

      statusBox.textContent =
      'Say "MAX"... 🎤';

    }

  };


  recognition.onresult =
  function(event) {

    listening = false;

    orb.classList.remove("listening");


    const heard =
    event.results[0][0].transcript.trim();


    console.log(
      "MAX heard:",
      heard
    );


    // =================================
    // COMMAND MODE
    // =================================

    if (waitingForCommand) {

      waitingForCommand = false;

      sendMessage(heard);

      return;

    }


    // =================================
    // WAKE WORD MODE
    // =================================

    const command =
    removeWakeWord(heard);


    if (command === "") {

      // User only said MAX

      waitingForCommand = true;

      speakWakeResponse();

      return;

    }


    // User said:
    // "MAX how are you?"

    waitingForCommand = false;

    sendMessage(command);

  };


  recognition.onerror =
  function(event) {

    listening = false;

    orb.classList.remove("listening");


    console.log(
      "Recognition error:",
      event.error
    );


    if (event.error === "not-allowed") {

      statusBox.textContent =
      "Microphone permission denied.";

      maxActive = false;

      return;

    }


    if (
      maxActive &&
      !speaking &&
      !thinking
    ) {

      setTimeout(
        listen,
        800
      );

    }

  };


  recognition.onend =
  function() {

    listening = false;

    orb.classList.remove("listening");


    /*
      IMPORTANT:

      If waitingForCommand is TRUE,
      we DON'T listen for MAX.

      We listen directly for the command.
    */

    if (
      maxActive &&
      !speaking &&
      !thinking &&
      !listening
    ) {

      setTimeout(
        listen,
        400
      );

    }

  };

}


// =====================================
// START
// =====================================

startBtn.onclick =
function() {

  startMAX();

};


stopBtn.onclick =
function() {

  stopMAX();

};


function startMAX() {

  if (!recognition) {
    return;
  }


  maxActive = true;

  waitingForCommand = false;


  startBtn.style.display =
  "none";

  stopBtn.style.display =
  "inline-block";


  statusBox.textContent =
  'Say "MAX"... 🎤';


  listen();

}


// =====================================
// STOP
// =====================================

function stopMAX() {

  maxActive = false;

  waitingForCommand = false;

  listening = false;

  thinking = false;

  speaking = false;


  try {

    recognition.stop();

  } catch(e) {}


  speechSynthesis.cancel();


  orb.className = "";


  startBtn.style.display =
  "inline-block";

  stopBtn.style.display =
  "none";


  statusBox.textContent =
  "MAX stopped.";

}


// =====================================
// LISTEN
// =====================================

function listen() {

  if (
    !maxActive ||
    listening ||
    speaking ||
    thinking
  ) {

    return;

  }


  try {

    recognition.start();

  } catch(e) {

    console.log(
      "Recognition already active."
    );

  }

}


// =====================================
// WAKE WORD
// =====================================

function removeWakeWord(text) {

  let clean =
  text
  .toLowerCase()
  .trim();


  clean =
  clean.replace(
    /^[,.\s]*(hey|okay|ok)?\s*max[\s,.\-:]*/i,
    ""
  );


  return clean.trim();

}


// =====================================
// "HAAN BOSS"
// =====================================

function speakWakeResponse() {

  speaking = true;

  orb.className =
  "speaking";


  statusBox.textContent =
  "MAX is listening...";


  speechSynthesis.cancel();


  const voice =
  new SpeechSynthesisUtterance(
    "Haan boss."
  );


  voice.lang =
  "en-IN";

  voice.rate =
  0.95;

  voice.pitch =
  1;


  voice.onend =
  function() {

    speaking = false;

    orb.className =
    "listening";


    /*
      THIS IS THE IMPORTANT FIX.

      After "Haan boss",
      immediately listen for the command.
    */

    if (maxActive) {

      statusBox.textContent =
      "I'm listening... 🎤";

      setTimeout(
        listen,
        300
      );

    }

  };


  voice.onerror =
  function() {

    speaking = false;

    orb.className =
    "";


    if (maxActive) {

      setTimeout(
        listen,
        300
      );

    }

  };


  speechSynthesis.speak(
    voice
  );

}


// =====================================
// SEND TO AI
// =====================================

async function sendMessage(message) {

  if (!message) {

    waitingForCommand = false;

    statusBox.textContent =
    'Say "MAX"...';

    listen();

    return;

  }


  thinking = true;

  speaking = false;


  orb.className =
  "thinking";


  statusBox.textContent =
  "Thinking... 🧠";


  responseBox.innerHTML =
  "<b>You:</b> " +
  escapeHtml(message) +
  "<br><br>" +
  "<b>MAX:</b> Thinking...";


  try {

    const response =
    await fetch(
      BACKEND,
      {
        method: "POST",

        headers: {
          "Content-Type":
          "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      }
    );


    const data =
    await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "MAX server error"
      );

    }


    const reply =
    data.reply || "";


    thinking = false;


    responseBox.innerHTML =
    "<b>You:</b> " +
    escapeHtml(message) +
    "<br><br>" +
    "<b>MAX:</b> " +
    escapeHtml(reply);


    speakReply(reply);


  } catch(error) {

    thinking = false;

    orb.className = "";


    responseBox.innerHTML =
    "<b>Error:</b> " +
    escapeHtml(error.message);


    statusBox.textContent =
    "Something went wrong.";


    if (maxActive) {

      setTimeout(
        listen,
        1000
      );

    }

  }

}


// =====================================
// SPEAK AI REPLY
// =====================================

function speakReply(text) {

  if (!text) {

    thinking = false;

    listen();

    return;

  }


  speechSynthesis.cancel();


  const clean =
  cleanForSpeech(text);


  const voice =
  new SpeechSynthesisUtterance(
    clean
  );


  speaking = true;

  thinking = false;


  if (
    /[\u0900-\u097F]/.test(text)
  ) {

    voice.lang =
    "hi-IN";

  } else {

    voice.lang =
    "en-IN";

  }


  voice.rate =
  0.95;

  voice.pitch =
  1;

  voice.volume =
  1;


  voice.onstart =
  function() {

    orb.className =
    "speaking";

    statusBox.textContent =
    "MAX is speaking... 🔊";

  };


  voice.onend =
  function() {

    speaking = false;

    orb.className = "";


    if (maxActive) {

      waitingForCommand = false;

      statusBox.textContent =
      'Say "MAX"... 🎤';

      setTimeout(
        listen,
        500
      );

    }

  };


  voice.onerror =
  function() {

    speaking = false;

    orb.className = "";


    if (maxActive) {

      waitingForCommand = false;

      setTimeout(
        listen,
        500
      );

    }

  };


  speechSynthesis.speak(
    voice
  );

}


// =====================================
// CLEAN SPEECH
// =====================================

function cleanForSpeech(text) {

  return text

    .replace(
      /```[\s\S]*?```/g,
      ""
    )

    .replace(
      /\*\*/g,
      ""
    )

    .replace(
      /\*/g,
      ""
    )

    .replace(
      /__/g,
      ""
    )

    .replace(
      /_/g,
      ""
    )

    .replace(
      /`/g,
      ""
    )

    .replace(
      /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,
      ""
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}


// =====================================
// SECURITY
// =====================================

function escapeHtml(text) {

  const div =
  document.createElement("div");

  div.textContent =
  text;

  return div.innerHTML;

}

</script>

</body>
</html>
