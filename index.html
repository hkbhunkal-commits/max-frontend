<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX AI</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    width: 90%;
    max-width: 600px;
    background: #1e293b;
    padding: 30px 20px;
    border-radius: 25px;
    text-align: center;
}

h1 {
    font-size: 35px;
    margin: 0;
}

#orb {
    width: 140px;
    height: 140px;
    margin: 30px auto;
    border-radius: 50%;
    background: #334155;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 50px;
}

.listening {
    background: #2563eb !important;
}

.thinking {
    background: #7c3aed !important;
}

.speaking {
    background: #16a34a !important;
}

button {
    padding: 15px 25px;
    margin: 8px;

    border: none;
    border-radius: 14px;

    font-size: 17px;
    font-weight: bold;
}

#stop {
    display: none;
}

#status {
    color: #cbd5e1;
    margin: 15px;
}

#response {
    margin-top: 20px;
    padding: 15px;

    background: #0f172a;
    border-radius: 15px;

    text-align: left;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="box">

<h1>MAX 🤖</h1>

<div id="orb">🤖</div>

<div id="status">
    Press START MAX
</div>

<button id="start">
    🎤 START MAX
</button>

<button id="stop">
    🛑 STOP
</button>

<div id="response"></div>

</div>


<script>

// ========================================
// BACKEND
// ========================================

const BACKEND =
"https://max-backend-u4r6.onrender.com/chat";


// ========================================
// ELEMENTS
// ========================================

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

const status =
document.getElementById("status");

const responseBox =
document.getElementById("response");

const orb =
document.getElementById("orb");


// ========================================
// VARIABLES
// ========================================

let recognition;

let active = false;

let listening = false;

let speaking = false;


// ========================================
// CHECK SPEECH API
// ========================================

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    status.textContent =
    "❌ Voice recognition not supported. Open this in Chrome.";

} else {

    recognition =
    new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang = "en-IN";


    // ====================================
    // MICROPHONE STARTED
    // ====================================

    recognition.onstart = function() {

        listening = true;

        orb.className =
        "listening";

        status.textContent =
        "🎤 Listening...";

    };


    // ====================================
    // USER SPOKE
    // ====================================

    recognition.onresult =
    function(event) {

        listening = false;

        orb.className = "";


        const text =
        event.results[0][0].transcript.trim();


        console.log(
            "User said:",
            text
        );


        if (!text) {

            startListening();

            return;

        }


        // -------------------------------
        // WAKE WORD
        // -------------------------------

        let command =
        text.replace(
            /^(hey|okay|ok)?\s*max[\s,.\-:]*/i,
            ""
        ).trim();


        // User only said MAX

        if (!command) {

            speak(
                "Haan boss.",
                function() {

                    if (active) {

                        startListening();

                    }

                }
            );

            return;

        }


        // User said:
        // MAX how are you?

        sendToMAX(command);

    };


    // ====================================
    // ERROR
    // ====================================

    recognition.onerror =
    function(event) {

        listening = false;

        orb.className = "";


        console.log(
            "Speech error:",
            event.error
        );


        if (
            event.error === "not-allowed"
        ) {

            status.textContent =
            "❌ Microphone permission denied.";

            return;

        }


        if (active) {

            setTimeout(
                startListening,
                500
            );

        }

    };


    // ====================================
    // END
    // ====================================

    recognition.onend =
    function() {

        listening = false;


        if (
            active &&
            !speaking
        ) {

            setTimeout(
                startListening,
                500
            );

        }

    };

}


// ========================================
// START MAX
// ========================================

startButton.onclick =
function() {

    active = true;


    startButton.style.display =
    "none";

    stopButton.style.display =
    "inline-block";


    status.textContent =
    'Say "MAX"... 🎤';


    startListening();

};


// ========================================
// STOP MAX
// ========================================

stopButton.onclick =
function() {

    active = false;

    listening = false;

    speaking = false;


    speechSynthesis.cancel();


    try {

        recognition.stop();

    } catch(e) {}


    orb.className = "";


    startButton.style.display =
    "inline-block";

    stopButton.style.display =
    "none";


    status.textContent =
    "MAX stopped.";

};


// ========================================
// START LISTENING
// ========================================

function startListening() {

    if (
        !active ||
        listening ||
        speaking
    ) {

        return;

    }


    try {

        recognition.start();

    } catch(e) {

        console.log(
            "Start error:",
            e
        );

    }

}


// ========================================
// SEND TO BACKEND
// ========================================

async function sendToMAX(message) {

    status.textContent =
    "🧠 Thinking...";

    orb.className =
    "thinking";


    try {

        const response =
        await fetch(

            BACKEND,

            {

                method: "POST",

                headers: {

                    "Content-Type":
                    "application/json"

                },

                body: JSON.stringify({

                    message: message

                })

            }

        );


        const data =
        await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "MAX error"
            );

        }


        const reply =
        data.reply || "";


        responseBox.innerHTML =
        "<b>You:</b> " +
        escapeHTML(message) +

        "<br><br>" +

        "<b>MAX:</b> " +
        escapeHTML(reply);


        speak(
            reply,
            function() {

                if (active) {

                    status.textContent =
                    'Say "MAX"... 🎤';

                    startListening();

                }

            }
        );


    } catch(error) {

        orb.className = "";


        status.textContent =
        "❌ " +
        error.message;


        if (active) {

            setTimeout(
                startListening,
                1000
            );

        }

    }

}


// ========================================
// SPEAK
// ========================================

function speak(text, finished) {

    speechSynthesis.cancel();


    const clean =
    cleanText(text);


    if (!clean) {

        finished();

        return;

    }


    const utterance =
    new SpeechSynthesisUtterance(
        clean
    );


    speaking = true;

    orb.className =
    "speaking";


    if (
        /[\u0900-\u097F]/.test(text)
    ) {

        utterance.lang =
        "hi-IN";

    } else {

        utterance.lang =
        "en-IN";

    }


    utterance.rate =
    1;


    utterance.pitch =
    1;


    utterance.onstart =
    function() {

        status.textContent =
        "🔊 MAX is speaking...";

    };


    utterance.onend =
    function() {

        speaking = false;

        orb.className = "";


        if (finished) {

            finished();

        }

    };


    utterance.onerror =
    function() {

        speaking = false;

        orb.className = "";


        if (finished) {

            finished();

        }

    };


    speechSynthesis.speak(
        utterance
    );

}


// ========================================
// CLEAN SPEECH
// ========================================

function cleanText(text) {

    return text

        .replace(
            /```[\s\S]*?```/g,
            ""
        )

        .replace(
            /\*\*/g,
            ""
        )

        .replace(
            /\*/g,
            ""
        )

        .replace(
            /`/g,
            ""
        )

        .replace(
            /[#_>-]/g,
            " "
        )

        .replace(
            /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


// ========================================
// SECURITY
// ========================================

function escapeHTML(text) {

    const div =
    document.createElement("div");

    div.textContent =
    text;

    return div.innerHTML;

}

</script>

</body>
</html>
