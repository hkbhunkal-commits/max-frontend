<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX AI</title>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }

    .box {
      max-width: 600px;
      margin: 50px auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      width: 90%;
      box-sizing: border-box;
      padding: 13px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 12px 25px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #response {
      margin-top: 25px;
      text-align: left;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>MAX AI 🤖</h1>

    <input
      id="msg"
      type="text"
      placeholder="Ask MAX anything..."
    >

    <br>

    <button id="sendBtn" onclick="sendMessage()">Send</button>

    <div id="response"></div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("msg");
      const button = document.getElementById("sendBtn");
      const responseBox = document.getElementById("response");

      const msg = input.value.trim();

      if (!msg) {
        responseBox.innerHTML = "<b>Please type a message.</b>";
        return;
      }

      button.disabled = true;
      responseBox.innerHTML = "MAX is thinking... 🤔";

      try {
        const res = await fetch(
          "https://max-backend-u4r6.onrender.com/chat",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: msg
            })
          }
        );

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Server error");
        }

        responseBox.innerHTML =
          "<b>MAX:</b> " +
          escapeHtml(data.reply);

      } catch (error) {
        responseBox.innerHTML =
          "<b>Error:</b> " + escapeHtml(error.message);
      }

      button.disabled = false;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById("msg").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
