<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX AI</title>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 25px;
    }

    #orb {
      width: 130px;
      height: 130px;
      margin: 25px auto;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      transition: 0.3s;
    }

    #orb.listening {
      background: #2563eb;
      transform: scale(1.08);
    }

    #orb.speaking {
      background: #16a34a;
      transform: scale(1.08);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      margin: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      font-size: 20px;
      padding: 16px 25px;
    }

    #status {
      margin: 15px;
      color: #cbd5e1;
    }

    #response {
      margin-top: 25px;
      text-align: left;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>MAX 🤖</h1>

    <div id="orb">🤖</div>

    <div id="status">
      Tap START and say "MAX"
    </div>

    <button id="startBtn" onclick="startMAX()">
      🎤 Start MAX
    </button>

    <div id="response"></div>

  </div>


<script>

const BACKEND =
  "https://max-backend-u4r6.onrender.com/chat";

const orb =
  document.getElementById("orb");

const statusBox =
  document.getElementById("status");

const responseBox =
  document.getElementById("response");

const startBtn =
  document.getElementById("startBtn");


let recognition = null;

let maxActive = false;

let isSpeaking = false;

let waitingForCommand = false;


// =====================================
// SPEECH RECOGNITION
// =====================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  statusBox.textContent =
    "Voice recognition is not supported in this browser.";

} else {

  recognition =
    new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.lang = "en-IN";


  recognition.onstart = function () {

    orb.classList.add("listening");

    statusBox.textContent =
      waitingForCommand
        ? "Listening for your command... 🎤"
        : 'Say "MAX"... 🎤';

  };


  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript.trim();

    orb.classList.remove("listening");

    console.log("Heard:", text);


    // =================================
    // WAKE WORD
    // =================================

    if (!waitingForCommand) {

      if (isWakeWord(text)) {

        waitingForCommand = true;

        speakText("Haan boss.");

      } else {

        statusBox.textContent =
          'Say "MAX" to wake me.';

        restartListening();

      }

      return;
    }


    // =================================
    // COMMAND
    // =================================

    if (text) {

      waitingForCommand = false;

      sendMessage(text);

    }

  };


  recognition.onerror = function(event) {

    console.log(
      "Recognition error:",
      event.error
    );

    orb.classList.remove("listening");

    if (maxActive) {

      setTimeout(
        restartListening,
        700
      );

    }

  };


  recognition.onend = function() {

    orb.classList.remove("listening");

    /*
      Don't restart while MAX is speaking.
      Speech ending will restart listening.
    */

    if (
      maxActive &&
      !isSpeaking &&
      !waitingForCommand
    ) {

      restartListening();

    }

  };

}


// =====================================
// START MAX
// =====================================

function startMAX() {

  if (!recognition) {
    return;
  }


  maxActive = true;

  waitingForCommand = false;


  startBtn.textContent =
    "🛑 Stop MAX";

  statusBox.textContent =
    'Say "MAX"... 🎤';


  restartListening();

}


// =====================================
// STOP MAX
// =====================================

function stopMAX() {

  maxActive = false;

  waitingForCommand = false;

  isSpeaking = false;


  if (recognition) {

    try {
      recognition.stop();
    } catch (e) {}

  }


  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

  }


  orb.classList.remove("listening");

  orb.classList.remove("speaking");


  startBtn.textContent =
    "🎤 Start MAX";

  statusBox.textContent =
    'Tap START and say "MAX"';

}


// =====================================
// BUTTON TOGGLE
// =====================================

startBtn.addEventListener(
  "click",
  function() {

    if (maxActive) {

      stopMAX();

    } else {

      startMAX();

    }

  }
);


// =====================================
// CHECK WAKE WORD
// =====================================

function isWakeWord(text) {

  const clean =
    text
      .toLowerCase()
      .replace(/[.,!?]/g, "")
      .trim();


  return (
    clean === "max" ||
    clean === "hey max" ||
    clean === "okay max" ||
    clean === "ok max"
  );

}


// =====================================
// RESTART LISTENING
// =====================================

function restartListening() {

  if (!maxActive) {
    return;
  }


  if (isSpeaking) {
    return;
  }


  setTimeout(function() {

    try {

      recognition.start();

    } catch (error) {

      console.log(
        "Recognition restart:",
        error
      );

    }

  }, 500);

}


// =====================================
// SEND MESSAGE TO AI
// =====================================

async function sendMessage(message) {

  try {

    statusBox.textContent =
      "Thinking... 🧠";


    responseBox.innerHTML =
      "<b>You:</b> " +
      escapeHtml(message) +
      "<br><br>" +
      "<b>MAX:</b> Thinking...";


    const response =
      await fetch(
        BACKEND,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "MAX server error"
      );

    }


    const reply =
      data.reply || "";


    responseBox.innerHTML =
      "<b>You:</b> " +
      escapeHtml(message) +
      "<br><br>" +
      "<b>MAX:</b> " +
      escapeHtml(reply);


    speakText(reply);


  } catch (error) {

    responseBox.innerHTML =
      "<b>Error:</b> " +
      escapeHtml(error.message);


    statusBox.textContent =
      "Something went wrong.";


    waitingForCommand = false;

    restartListening();

  }

}


// =====================================
// MAX SPEAK
// =====================================

function speakText(text) {

  if (
    !("speechSynthesis" in window) ||
    !text
  ) {

    waitingForCommand = false;

    restartListening();

    return;

  }


  window.speechSynthesis.cancel();


  const cleanText =
    cleanForSpeech(text);


  const speech =
    new SpeechSynthesisUtterance(
      cleanText
    );


  if (
    /[\u0900-\u097F]/.test(text)
  ) {

    speech.lang = "hi-IN";

  } else {

    speech.lang = "en-IN";

  }


  speech.rate = 0.95;

  speech.pitch = 1;

  speech.volume = 1;


  speech.onstart = function() {

    isSpeaking = true;

    orb.classList.remove(
      "listening"
    );

    orb.classList.add(
      "speaking"
    );


    statusBox.textContent =
      "MAX is speaking... 🔊";

  };


  speech.onend = function() {

    isSpeaking = false;

    orb.classList.remove(
      "speaking"
    );


    // After "Haan boss", listen for command.
    // After normal answer, listen for MAX.

    if (maxActive) {

      if (waitingForCommand) {

        statusBox.textContent =
          "I'm listening... 🎤";

      } else {

        statusBox.textContent =
          'Say "MAX"... 🎤';

      }


      restartListening();

    }

  };


  speech.onerror = function() {

    isSpeaking = false;

    orb.classList.remove(
      "speaking"
    );


    window.speechSynthesis.cancel();


    if (maxActive) {

      statusBox.textContent =
        'Say "MAX"... 🎤';

      restartListening();

    }

  };


  speechSynthesis.speak(
    speech
  );

}


// =====================================
// CLEAN TEXT
// =====================================

function cleanForSpeech(text) {

  return text

    .replace(
      /```[\s\S]*?```/g,
      ""
    )

    .replace(/\*\*/g, "")

    .replace(/\*/g, "")

    .replace(/__/g, "")

    .replace(/_/g, "")

    .replace(/`/g, "")

    .replace(
      /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,
      ""
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}


// =====================================
// SECURITY
// =====================================

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
  </html>
